    ser.forEach((s,i) => { const x = X(s[0]), y = Y(s[idx]); i ? pctx.lineTo(x,y) : pctx.moveTo(x,y); });
    pctx.stroke();
  }
}

<script>
"use strict";
/* ==========================================================================
   Video export.

   The interactive solver picks its timestep adaptively, which is right on
   screen but wrong for video: frames would represent unequal slices of time
   and the motion would be subtly wrong. So export runs on a fixed schedule --
   every video frame advances exactly the same simulated interval, subdivided
   into however many equal sub-steps stability requires.

   WebCodecs gives encoded chunks but no container, so there is a minimal
   Matroska/WebM muxer and a minimal MP4 muxer below.
   ========================================================================== */

/* ---- EBML primitives ---- */
function ebmlVint(n){
  let len = 1;
  while (n >= Math.pow(2, 7 * len) - 1) len++;
  const b = new Uint8Array(len);
  let v = n;
  for (let i = len - 1; i >= 0; i--){ b[i] = v & 0xff; v = Math.floor(v / 256); }
  b[0] |= 1 << (8 - len);
  return b;
}
function ebmlUint(n){
  const out = [];
  let v = Math.round(n);
  do { out.unshift(v & 0xff); v = Math.floor(v / 256); } while (v > 0);
  return new Uint8Array(out);
}
function ebmlFloat(x){
  const b = new Uint8Array(8);
  new DataView(b.buffer).setFloat64(0, x, false);
  return b;
}
const ebmlStr = t => new TextEncoder().encode(t);
function bytesJoin(list){
  let n = 0; for (const a of list) n += a.length;
  const out = new Uint8Array(n);
  let o = 0; for (const a of list){ out.set(a, o); o += a.length; }
  return out;
}
function ebmlElem(id, data){
  const idb = new Uint8Array(id), sz = ebmlVint(data.length);
  return bytesJoin([idb, sz, data]);
}

function webmMux(frames, width, height, fps, codecId){
  const header = ebmlElem([0x1A,0x45,0xDF,0xA3], bytesJoin([
    ebmlElem([0x42,0x86], ebmlUint(1)),
    ebmlElem([0x42,0xF7], ebmlUint(1)),
    ebmlElem([0x42,0xF2], ebmlUint(4)),
    ebmlElem([0x42,0xF3], ebmlUint(8)),
    ebmlElem([0x42,0x82], ebmlStr('webm')),
    ebmlElem([0x42,0x87], ebmlUint(2)),
    ebmlElem([0x42,0x85], ebmlUint(2)),
  ]));
  const durMs = frames.length * 1000 / fps;
  const info = ebmlElem([0x15,0x49,0xA9,0x66], bytesJoin([
    ebmlElem([0x2A,0xD7,0xB1], ebmlUint(1000000)),          // 1 ms timecode scale
    ebmlElem([0x4D,0x80], ebmlStr('rocketsim')),
    ebmlElem([0x57,0x41], ebmlStr('rocketsim')),
    ebmlElem([0x44,0x89], ebmlFloat(durMs)),
  ]));
  const tracks = ebmlElem([0x16,0x54,0xAE,0x6B], ebmlElem([0xAE], bytesJoin([
    ebmlElem([0xD7], ebmlUint(1)),
    ebmlElem([0x73,0xC5], ebmlUint(1)),
    ebmlElem([0x83], ebmlUint(1)),                          // video
    ebmlElem([0x9C], ebmlUint(0)),                          // no lacing
    ebmlElem([0x86], ebmlStr(codecId)),
    ebmlElem([0x23,0xE3,0x83], ebmlUint(Math.round(1e9 / fps))),
    ebmlElem([0xE0], bytesJoin([
      ebmlElem([0xB0], ebmlUint(width)),
      ebmlElem([0xBA], ebmlUint(height)),
    ])),
  ])));

  const clusters = [];
  let cur = null, curTime = 0;
  const flushCluster = () => {
    if (!cur || !cur.length) return;
    clusters.push(ebmlElem([0x1F,0x43,0xB6,0x75],
      bytesJoin([ebmlElem([0xE7], ebmlUint(curTime)), ...cur])));
    cur = null;
  };
  for (const f of frames){
    const tMs = Math.round(f.timestamp / 1000);
    // a cluster must start on a keyframe, and its block offsets are a signed 16-bit ms
    if (!cur || (f.key && tMs - curTime > 1000) || tMs - curTime > 30000){
      flushCluster(); cur = []; curTime = tMs;
    }
    const tn = ebmlVint(1);
    const blk = new Uint8Array(tn.length + 3 + f.data.length);
    blk.set(tn, 0);
    new DataView(blk.buffer).setInt16(tn.length, tMs - curTime, false);
    blk[tn.length + 2] = f.key ? 0x80 : 0x00;
    blk.set(f.data, tn.length + 3);
    cur.push(ebmlElem([0xA3], blk));
  }
  flushCluster();

  const segment = ebmlElem([0x18,0x53,0x80,0x67], bytesJoin([info, tracks, ...clusters]));
  return new Blob([header, segment], { type:'video/webm' });
}

/* ---- MP4 (H.264) muxer -------------------------------------------------
   WebM/VP9 is fine for the web but many editors will not touch it, so MP4 is
   the default. Layout is ftyp / mdat / moov with chunk offsets pointing into
   the mdat already written. Not "faststart", which only matters for
   progressive download over a network. */
function mp4Box(type, ...parts){
  let n = 8; for (const p of parts) n += p.length;
  const out = new Uint8Array(n), dv = new DataView(out.buffer);
  dv.setUint32(0, n);
  for (let i = 0; i < 4; i++) out[4+i] = type.charCodeAt(i);
  let o = 8; for (const p of parts){ out.set(p, o); o += p.length; }
  return out;
}
const u8 = a => new Uint8Array(a);
function u16(n){ const b = new Uint8Array(2); new DataView(b.buffer).setUint16(0, n); return b; }
function u32(n){ const b = new Uint8Array(4); new DataView(b.buffer).setUint32(0, n >>> 0); return b; }
const mp4Str = t => new TextEncoder().encode(t);

function mp4Mux(frames, width, height, fps, description){
  const timescale = 90000;                        // 90 kHz, the usual video clock
  const dur = Math.round(timescale / fps);
  const n = frames.length;
  const total = frames.reduce((a, f) => a + f.data.length, 0);

  const ftyp = mp4Box('ftyp', mp4Str('isom'), u32(0x200),
                              mp4Str('isom'), mp4Str('iso2'), mp4Str('avc1'), mp4Str('mp41'));
  const mdatStart = ftyp.length + 8;
  const payload = new Uint8Array(total);
  const sizes = [], offsets = [];
  let o = 0;
  for (const f of frames){
    offsets.push(mdatStart + o); sizes.push(f.data.length);
    payload.set(f.data, o); o += f.data.length;
  }
  const mdat = mp4Box('mdat', payload);

  const avcC = mp4Box('avcC', new Uint8Array(description));
  const avc1 = mp4Box('avc1',
    u8([0,0,0,0,0,0]), u16(1),
    u16(0), u16(0), u32(0), u32(0), u32(0),
    u16(width), u16(height),
    u32(0x00480000), u32(0x00480000),
    u32(0), u16(1),
    u8(new Array(32).fill(0)),
    u16(0x0018), u16(0xffff),
    avcC);
  const stsd = mp4Box('stsd', u32(0), u32(1), avc1);
  const stts = mp4Box('stts', u32(0), u32(1), u32(n), u32(dur));
  const syncs = [];
  frames.forEach((f, i) => { if (f.key) syncs.push(i + 1); });
  const stss = mp4Box('stss', u32(0), u32(syncs.length), ...syncs.map(u32));
  const stsc = mp4Box('stsc', u32(0), u32(1), u32(1), u32(1), u32(1));
  const stsz = mp4Box('stsz', u32(0), u32(0), u32(n), ...sizes.map(u32));
  const stco = mp4Box('stco', u32(0), u32(n), ...offsets.map(u32));
  const stbl = mp4Box('stbl', stsd, stts, stss, stsc, stsz, stco);
  const dref = mp4Box('dref', u32(0), u32(1), mp4Box('url ', u32(1)));
  const minf = mp4Box('minf', mp4Box('vmhd', u32(1), u32(0), u32(0)),
                              mp4Box('dinf', dref), stbl);
  const mdhd = mp4Box('mdhd', u32(0), u32(0), u32(0), u32(timescale), u32(n * dur),
                              u16(0x55c4), u16(0));
  const hdlr = mp4Box('hdlr', u32(0), u32(0), mp4Str('vide'),
                              u32(0), u32(0), u32(0), mp4Str('VideoHandler'), u8([0]));
  const mdia = mp4Box('mdia', mdhd, hdlr, minf);
  const ident = [u32(0x00010000), u32(0), u32(0),
                 u32(0), u32(0x00010000), u32(0),
                 u32(0), u32(0), u32(0x40000000)];
  const durMovie = Math.round(n * dur * 1000 / timescale);
  const tkhd = mp4Box('tkhd', u32(7), u32(0), u32(0), u32(1), u32(0), u32(durMovie),
                              u32(0), u32(0), u16(0), u16(0), u16(0), u16(0),
                              ...ident, u32(width << 16), u32(height << 16));
  const trak = mp4Box('trak', tkhd, mdia);
  const mvhd = mp4Box('mvhd', u32(0), u32(0), u32(0), u32(1000), u32(durMovie),
                              u32(0x00010000), u16(0x0100), u16(0), u32(0), u32(0),
                              ...ident, u32(0), u32(0), u32(0), u32(0), u32(0), u32(0), u32(2));
  const moov = mp4Box('moov', mvhd, trak);
  return new Blob([ftyp, mdat, moov], { type:'video/mp4' });
}

const VIDEO_FORMATS = {
  mp4:   { label:'MP4 / H.264 (widest editor support)', ext:'mp4',
           codec:['avc1.640028','avc1.4d0028','avc1.42001f'],
           opts:{ avc:{ format:'avc' } } },
  webm:  { label:'WebM / VP9 (smaller files)', ext:'webm',
           codec:['vp09.00.10.08'], matroska:'V_VP9' },
  webm8: { label:'WebM / VP8 (most compatible WebM)', ext:'webm',
           codec:['vp8'], matroska:'V_VP8' },
};

/* ---- fixed-timestep advance ---------------------------------------------
   FIXED_DT overrides the adaptive chooser. Each video frame covers exactly
   msPerFrame of flight, split into equal sub-steps small enough for stability.
   The sub-step count may vary between frames; the frame interval never does. */
async function currentDtLimit(){
  const dev = WG.dev;
  if (!dev) return 0.01;
  await dev.queue.onSubmittedWorkDone();
  const src = CP.red[CP.red.length-1].out;
  if (!EXP.readBuf) EXP.readBuf = dev.createBuffer({ size:8,
    usage:GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const enc = dev.createCommandEncoder();
  enc.copyBufferToBuffer(src, 0, EXP.readBuf, 0, 8);
  dev.queue.submit([enc.finish()]);
  await EXP.readBuf.mapAsync(GPUMapMode.READ);
  const m = new Float32Array(EXP.readBuf.getMappedRange().slice(0));
  EXP.readBuf.unmap();
  if (Number.isFinite(m[0]) && m[0] > 0) CP.waveMax = m[0];
  if (Number.isFinite(m[1])){
    CP.machMax = m[1];
    S.vmax = Math.max(m[1] * Math.sqrt(P.gamma * P.Rgas * P.tAmb), 1);
  }
  return compChooseDt();
}

async function advanceExactly(ms){
  const limit = Math.max(await currentDtLimit(), 1e-9);
  const nSub = Math.max(1, Math.ceil(ms / limit));
  FIXED_DT = ms / nSub;
  let left = nSub;
  while (left > 0){
    const n = Math.min(left, 512);
    compSteps(n);
    left -= n;
  }
  FIXED_DT = null;
  return nSub;
}

/* ---- the exporter ---- */
const EXP = { running:false, cancel:false, scale:null, slots:null, sw:0, sh:0, readBuf:null, tex:null, buf:null, tw:0, th:0 };

/* A WebGPU canvas does not present until a task boundary, so drawImage() straight after
   submit() yields a blank frame. Render into our own texture and copy it out instead:
   deterministic, and it works at any resolution without touching the visible canvas. */
/* One field per frame used to mean one GPU round trip per field, and those serialise:
   seven fields cost seven full stalls rather than seven cheap renders. Issue all the
   renders and copies first, then wait on the maps together. */
function exportRenderSlot(k, w, h){
  const dev = WG.dev;
  if (!EXP.slots || EXP.sw !== w || EXP.sh !== h){
    for (const sl of (EXP.slots || [])){ sl.tex.destroy(); sl.buf.destroy(); }
    EXP.slots = []; EXP.sw = w; EXP.sh = h;
    EXP.sbpr = Math.ceil(w * 4 / 256) * 256;
  }
  while (EXP.slots.length <= k){
    EXP.slots.push({
      tex: dev.createTexture({ size:[w, h], format:WG.fmt,
        usage:GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC }),
      buf: dev.createBuffer({ size:EXP.sbpr * h,
        usage:GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ }),
    });
  }
  const sl = EXP.slots[k];
  const view = sl.tex.createView();
  compRender(view, w, h);
  const enc = dev.createCommandEncoder();
  enc.copyTextureToBuffer({ texture:sl.tex },
    { buffer:sl.buf, bytesPerRow:EXP.sbpr, rowsPerImage:h }, [w, h, 1]);
  dev.queue.submit([enc.finish()]);
  return sl.buf.mapAsync(GPUMapMode.READ);
}
function exportReadSlot(k, w, h){
  const sl = EXP.slots[k];
  const src = new Uint8Array(sl.buf.getMappedRange());
  const row = w * 4;
  const out = new Uint8ClampedArray(row * h);
  if (EXP.sbpr === row) out.set(src.subarray(0, row * h));
  else for (let y = 0; y < h; y++) out.set(src.subarray(y*EXP.sbpr, y*EXP.sbpr + row), y*row);
  sl.buf.unmap();
  return out;
}

function expLog(msg){
  const el = document.getElementById('expStatus');
  if (el) el.innerHTML = msg;
}

const FIELD_NAMES = ['exhaust','speed','vorticity','pressure','velocity','mach','schlieren','temperature'];
const ALL_FIELDS = [0,1,2,3,4,5,6,7];

function setProgress(frac, label){
  const f = document.getElementById('pbarFill');
  if (f) f.style.width = (Math.max(0, Math.min(1, frac)) * 100).toFixed(1) + '%';
  if (label !== undefined) expLog(label);
}

async function makeEncoder(fmtKey, width, height, fps, bitrate, sink){
  const f = VIDEO_FORMATS[fmtKey];
  let chosen = null;
  for (const c of f.codec){
    try {
      const r = await VideoEncoder.isConfigSupported({ codec:c, width, height, bitrate,
                                                       framerate:fps });
      if (r.supported){ chosen = c; break; }
    } catch (e){}
  }
  if (!chosen) throw new Error('no supported codec for ' + f.label);
  const enc = new VideoEncoder({
    output: (chunk, meta) => {
      if (meta && meta.decoderConfig && meta.decoderConfig.description && !sink.desc)
        sink.desc = new Uint8Array(meta.decoderConfig.description);
      const b = new Uint8Array(chunk.byteLength); chunk.copyTo(b);
      sink.frames.push({ data:b, timestamp:chunk.timestamp, key:chunk.type === 'key' });
    },
    error: (e) => { sink.err = e; },
  });
  enc.configure(Object.assign({ codec:chosen, width, height, bitrate,
                                framerate:fps, latencyMode:'quality' }, f.opts || {}));
  return enc;
}

function saveBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/* One scan pass fixes the colour range; one stepping pass then feeds every requested
   field's encoder from the same simulation. Rendering costs a fraction of a step, so
   seven videos cost barely more than one. */
async function runExport(fields){
  if (EXP.running) { EXP.cancel = true; return; }
  if (typeof VideoEncoder === 'undefined'){
    expLog('<span style="color:var(--bad)">This browser has no WebCodecs VideoEncoder.</span>');
    return;
  }
  const fmtKey = OPT.format, fmt = VIDEO_FORMATS[fmtKey];
  const flightMs   = P.vidFlight;
  const fps        = Math.round(P.vidFps);
  const msPerFrame = P.vidMsPerFrame;
  const total      = Math.max(1, Math.round(flightMs / msPerFrame));
  const width      = Math.round(P.vidWidth / 64) * 64;   // 256-byte aligned rows
  const sc      = Math.max(1, width / 900);
  const headerH = Math.round(40 * sc);
  const footerH = Math.round(52 * sc);
  const simH    = Math.max(2, Math.round(width * (2 * S.Rmax) / S.Lz));
  const height  = Math.round((simH + headerH + footerH) / 2) * 2;

  EXP.running = true; EXP.cancel = false; EXP.scale = null;
  const btns = [document.getElementById('expBtn'), document.getElementById('expAllBtn')];
  btns[0].textContent = 'Cancel export';
  btns[1].disabled = true;
  const wasRunning = S.running, wasField = VIEW.field;
  S.running = false;
  EXPORTING = true;

  const comp = document.createElement('canvas');
  comp.width = width; comp.height = height;
  const cx = comp.getContext('2d');
  const sinks = fields.map(() => ({ frames:[], desc:null, err:null }));
  const encoders = [];
  let fatal = null;

  try {
    // ---- pass 1: peak, so the colour range is fixed for the whole clip ----
    const key = encodeState() + '|' + flightMs + '|' + msPerFrame;
    let peak;
    if (EXP.peakKey === key){
      peak = EXP.peakVal;
      setProgress(0, 'colour range reused from the last run of this configuration');
      await new Promise(r => setTimeout(r, 0));
    } else {
      buildGrid();
      peak = 0;
      for (let i = 0; i < total; i++){
        if (EXP.cancel) throw new Error('cancelled');
        await advanceExactly(msPerFrame);
        peak = Math.max(peak, S.vmax);
        if (i % 8 === 0){
          setProgress((i + 1) / total * 0.35,
            `pass 1 of 2 — scanning for the colour range, ${((i+1)/total*100).toFixed(0)}%`);
          await new Promise(r => setTimeout(r, 0));
        }
      }
      EXP.peakKey = key; EXP.peakVal = peak;
    }
    const scales = {};
    for (const f of fields){ VIEW.field = f; scales[f] = colourScaleFor(Math.max(peak, 1e-6)); }

    for (let k = 0; k < fields.length; k++)
      encoders.push(await makeEncoder(fmtKey, width, height, fps,
                                      Math.round(P.vidMbps * 1e6), sinks[k]));

    // ---- pass 2: step once, render and encode every field ----
    buildGrid();
    await new Promise(r => setTimeout(r, 0));
    const t0 = performance.now();
    for (let i = 0; i < total; i++){
      if (EXP.cancel) throw new Error('cancelled');
      for (const sk of sinks) if (sk.err) throw sk.err;
      const nSub = await advanceExactly(msPerFrame);
      const maps = [];
      for (let k = 0; k < fields.length; k++){
        VIEW.field = fields[k];
        EXP.scale = scales[fields[k]];
        maps.push(exportRenderSlot(k, width, simH));
      }
      await Promise.all(maps);
      for (let k = 0; k < fields.length; k++){
        VIEW.field = fields[k];
        EXP.scale = scales[fields[k]];
        S.colourScale = scales[fields[k]];
        const px = exportReadSlot(k, width, simH);
        cx.fillStyle = '#0b0e13';
        cx.fillRect(0, 0, width, height);
        cx.putImageData(new ImageData(px, width, simH), 0, headerH);
        drawOverlay(cx, width, height, headerH, simH, footerH, sc);
        const vf = new VideoFrame(comp, { timestamp: Math.round(i * 1e6 / fps),
                                          duration: Math.round(1e6 / fps) });
        encoders[k].encode(vf, { keyFrame: i % Math.max(1, fps * 2) === 0 });
        vf.close();
      }
      for (const e of encoders)
        while (e.encodeQueueSize > 8) await new Promise(r => setTimeout(r, 0));
      if (i % 4 === 0 || i === total - 1){
        const el = performance.now() - t0;
        const eta = (el / (i + 1)) * (total - i - 1) / 1000;
        setProgress(0.35 + (i + 1) / total * 0.65,
          `pass 2 of 2 — encoding ${i+1}/${total} · ${fields.length} field` +
          `${fields.length > 1 ? 's' : ''} · ${nSub} sub-steps · t = ${S.t.toFixed(2)} ms · ` +
          `${eta.toFixed(0)} s left`);
        await new Promise(r => setTimeout(r, 0));
      }
    }
    for (const e of encoders) await e.flush();
  } catch (e){
    if (!/cancelled/.test(e.message || '')) fatal = e;
  } finally {
    for (const e of encoders) if (e.state !== 'closed') { try { e.close(); } catch(x){} }
    EXPORTING = false; EXP.scale = null; EXP.running = false;
    VIEW.field = wasField;
    btns[0].textContent = 'Export video';
    btns[1].disabled = false;
    S.running = wasRunning;
    resizeCanvas();
  }

  if (fatal){
    setProgress(0, `<span style="color:var(--bad)">Encoder error: ${fatal.message || fatal}</span>`);
    return;
  }
  if (!sinks[0].frames.length){ setProgress(0, 'Cancelled — nothing written.'); return; }

  const base = `rocket_e${derived().eps.toFixed(1)}_pc${P.pcBar}bar_${flightMs}ms`;
  let bytes = 0;
  for (let k = 0; k < fields.length; k++){
    const sk = sinks[k];
    const blob = fmt.matroska
      ? webmMux(sk.frames, width, height, fps, fmt.matroska)
      : mp4Mux(sk.frames, width, height, fps, sk.desc || new Uint8Array(0));
    bytes += blob.size;
    const name = fields.length > 1
      ? `${base}_${FIELD_NAMES[fields[k]]}.${fmt.ext}`
      : `${base}_${FIELD_NAMES[fields[k]]}.${fmt.ext}`;
    saveBlob(blob, name);
    if (k < fields.length - 1) await new Promise(r => setTimeout(r, 350));  // browsers throttle bursts
  }
  setProgress(1, `Done — ${fields.length} file${fields.length > 1 ? 's' : ''}, ` +
    `${sinks[0].frames.length} frames each, ${(bytes/1e6).toFixed(1)} MB total, ` +
    `${(sinks[0].frames.length/fps).toFixed(1)} s of video.`);
}

const exportVideo = () => runExport([VIEW.field]);
const exportAllFields = () => runExport(ALL_FIELDS);

/* Labels go in the bands above and below the image, so nothing is drawn over the flow and
   no semi-transparent backing panel is needed. */
function drawOverlay(cx, w, h, headerH, simH, footerH, sc){
  const f = Math.round(13 * sc);
  cx.fillStyle = '#dfe6ee';
  cx.font = `${f}px ui-monospace, SFMono-Regular, Menlo, monospace`;
  cx.textBaseline = 'middle';
  cx.textAlign = 'left';
  const pad = Math.round(10 * sc);
  cx.fillText(`t = ${S.t.toFixed(2)} ms`, pad, headerH * 0.32);
  cx.fillStyle = '#8b97a6';
  cx.font = `${Math.round(11 * sc)}px ui-monospace, SFMono-Regular, Menlo, monospace`;
  const Dv = derived();
  cx.fillText(`\u03b5 ${fmt(Dv.eps,2)} \u00b7 p_c ${fmt(P.pcBar,0)} bar \u00b7 T_c ${fmt(P.Tc,0)} K \u00b7 ` +
              `p_amb ${fmtP(Dv.pa)} \u00b7 M\u221e ${fmt(Dv.machInf,2)} \u00b7 ` +
              `${P.nozShape === 0 ? 'conical' : 'bell'} nozzle`,
              pad, headerH * 0.72);

  const fy = headerH + simH;
  const legW = Math.min(Math.round(260 * sc), Math.round(w * 0.42));
  paintLegend(cx, pad, fy + Math.round(6*sc), legW, footerH - Math.round(12*sc),
              S.colourScale || 1, Math.round(11 * sc));

  // physical scale bar, on a round number of millimetres
  const pxPerMm = w / S.Lz;
  let barMm = Math.pow(10, Math.floor(Math.log10(S.Lz / 5)));
  if (barMm * pxPerMm < w * 0.08) barMm *= 2;
  if (barMm * pxPerMm > w * 0.30) barMm /= 2;
  const bw = barMm * pxPerMm;
  const bx = w - pad - bw, by = fy + footerH * 0.62;
  cx.strokeStyle = '#dfe6ee'; cx.fillStyle = '#dfe6ee';
  cx.lineWidth = Math.max(1, Math.round(1.5 * sc));
  const tick = Math.round(5 * sc);
  cx.beginPath();
  cx.moveTo(bx, by - tick); cx.lineTo(bx, by); cx.lineTo(bx + bw, by); cx.lineTo(bx + bw, by - tick);
  cx.stroke();
  cx.textAlign = 'center'; cx.textBaseline = 'top';
  cx.font = `${Math.round(11 * sc)}px ui-monospace, SFMono-Regular, Menlo, monospace`;
  cx.fillText(`${barMm >= 1 ? barMm : barMm.toFixed(1)} mm`, bx + bw/2, by + Math.round(3*sc));
  cx.textAlign = 'left'; cx.textBaseline = 'alphabetic';
}

</script>

<script>
"use strict";
/* ========================== control panel ========================== */
const UI = {};
const DOM = { scalebar: document.getElementById('scalebar'),
              pause:    document.getElementById('pause'),

const host = document.getElementById('controls');
const sliders = {};
let pendingRebuild = false;

function fmtVal(it, v){
  if (it.choices) return it.choices[Math.round(v)] || String(v);
  if (it.log){
    const x = Math.pow(10, v);
    const s = x >= 100 ? x.toFixed(0) : x >= 10 ? x.toFixed(1)
            : x >= 1 ? x.toFixed(2) : x.toPrecision(2);
    return s + (it.unit ? ' ' + it.unit : '');
  }
  const d = it.step >= 1 ? 0 : (it.step >= 0.1 ? 1 : (it.step >= 0.01 ? 2 : 4));
  return v.toFixed(d) + (it.unit ? ' ' + it.unit : '');
}

/* A discrete choice is a <select> and pushes a history entry; a slider is a range and
   replaces the current one, so dragging does not fill the back button with intermediates. */
function addControl(body, it){
  const wrap = document.createElement('div');
  wrap.className = 'ctl' + (it.rebuild ? ' rebuild' : '');
  if (it.choices){
    wrap.innerHTML =
      `<div class="lab"><span>${it.t}</span></div>` +
      `<select id="s_${it.k}">` +
      it.choices.map((c, i) => `<option value="${i}">${c}</option>`).join('') + `</select>` +
      (it.hint ? `<div class="hint">${it.hint}</div>` : '');
    body.appendChild(wrap);
    const sel = wrap.querySelector('select');
    sel.value = String(it.v);
    sliders[it.k] = { inp:sel, out:null, it };
    sel.addEventListener('change', () => {
      P[it.k] = parseFloat(sel.value);
      if (it.rebuild) pendingRebuild = true;
      scheduleURLSync(true);
      updateMetrics();
    });
    return;
  }
  wrap.innerHTML =
    `<div class="lab"><span>${it.t}</span><span id="v_${it.k}">${fmtVal(it, it.v)}</span></div>` +
    `<input type="range" id="s_${it.k}" min="${it.min}" max="${it.max}" step="${it.step}" value="${it.v}">` +
    (it.hint ? `<div class="hint">${it.hint}</div>` : '');
  body.appendChild(wrap);
  const inp = wrap.querySelector('input');
  sliders[it.k] = { inp, out: wrap.querySelector('#v_' + it.k), it };
  inp.addEventListener('input', () => {
    P[it.k] = parseFloat(inp.value);
    sliders[it.k].out.textContent = fmtVal(it, P[it.k]);
    if (it.rebuild) pendingRebuild = true;

}

for (const g of CONTROLS){

/* ---- export button, appended to the video section ---- */
{

/* ---- pacing toggle, appended to the solver section ---- */
{

}

/* ---- display section ---- */
{
  const d = document.createElement('details');
  d.open = true;
  d.innerHTML = `<summary>Display</summary><div class="body">
    <div class="ctl"><div class="lab"><span>Field</span></div>
      <select id="fieldSel">

        <option value="3">Pressure</option>

      </select></div>
    <div class="ctl"><div class="lab"><span>Colour gain</span><span id="v_gain">1.0×</span></div>
      <input type="range" id="s_gain" min="-1.2" max="1.5" step="0.02" value="0"></div>
    <label class="chk"><input type="checkbox" id="geomChk" checked> Draw the hardware</label>
  </div>`;
  host.appendChild(d);

  UI.fieldSel = d.querySelector('#fieldSel'); UI.geomChk = d.querySelector('#geomChk');
  gainIn.addEventListener('input', () => {
    VIEW.gain = Math.pow(10, parseFloat(gainIn.value));

    VIEW.showGeom = e.target.checked; scheduleURLSync(); });
}

/* ---- quality presets: the two knobs that actually trade speed for fidelity ---- */
const QUALITY = [
  { n:'Draft',    d:'coarse, for sweeping parameters', q:{ res:64,  cfl:0.5 } },
  { n:'Balanced', d:'the shipped default',             q:{ res:112, cfl:0.4 } },
  { n:'Accurate', d:'slow; for a final check',         q:{ res:192, cfl:0.3 } },
];
function markActiveQuality(){
  for (const b of document.querySelectorAll('#qrow button')){
    const q = QUALITY.find(x => x.n === b.dataset.quality);
    const on = q && Math.abs(P.res - q.q.res) < 1e-9 && Math.abs(P.cfl - q.q.cfl) < 1e-9;
    b.classList.toggle('active', !!on);
  }
}
{
  const d = document.createElement('details');
  d.open = true;
  d.innerHTML = `<summary>Quality</summary><div class="body">
    <div class="btnrow presets" id="qrow"></div>
    <div class="hint" style="margin-top:6px">Cost is roughly linear in the radial cell count,
    not quadratic: the timestep is set by the cell size, so a finer grid pays twice —
    once in cells and once in steps. Check the throat resolution in the panel before
    believing any number.</div></div>`;
  const row = d.querySelector('#qrow');
  for (const q of QUALITY){
    const b = document.createElement('button');
    b.innerHTML = `<b>${q.n}</b><i>${q.d}</i>`;
    b.dataset.quality = q.n;
    b.addEventListener('click', () => {
      Object.assign(P, q.q); syncSliders(); buildGrid(); pendingRebuild = false;
      scheduleURLSync(true); markActiveQuality(); updateMetrics();
    });
    row.appendChild(b);
  }
  host.appendChild(d);
}

/* ---- presets ---- */
{
  const d = document.createElement('details');
  d.open = true;
  d.innerHTML = `<summary>Presets</summary><div class="body"><div class="btnrow presets"></div>
    <div class="hint" style="margin-top:6px">Each one sets the nozzle, the chamber and the
    atmosphere together — the point being that a nozzle is only ever right for one
    altitude.</div></div>`;
  const row = d.querySelector('.presets');
  for (const pr of PRESETS){
    const b = document.createElement('button');
    b.innerHTML = `<b>${pr.n}</b><i>${pr.d}</i>`;
    b.addEventListener('click', () => {
      Object.assign(P, pr.p);
      syncSliders();
      buildGrid(); pendingRebuild = false;
      scheduleURLSync(true); updateMetrics();
    });
    row.appendChild(b);
  }
  host.appendChild(d);
}

function syncSliders(){
  for (const k in sliders){
    const s = sliders[k];
    s.inp.value = P[k];
    P[k] = parseFloat(s.inp.value);          // re-read so clamping to the control's range applies
    if (s.out) s.out.textContent = fmtVal(s.it, P[k]);
  }
}

document.getElementById('note').innerHTML =
  `<b>↻</b> marks parameters that rebuild the grid and restart the run.
   <b>Enter</b> re-ignites, <b>space</b> pauses.<br><br>
   <b>What this models.</b> A hot-gas plenum at the head of a combustion chamber, a
   converging–diverging nozzle you can shape, and the outside of the vehicle sitting in a
   freestream. The solver is compressible Navier–Stokes in cylindrical coordinates, so it
   carries acoustics: the throat chokes on its own, shocks form where they must, and an
   over-expanded nozzle separates without being told to.<br><br>
   <b>What it does not model.</b> Combustion, mixing, injector elements, multiple species,
   radiation, ablation, and any chemistry at all — the chamber is simply held at a stagnation
   pressure and temperature. One γ and one gas constant apply to the exhaust and to the
   atmosphere alike. Axial symmetry forbids the three-dimensional instabilities that break a
   real shear layer up, so the Smagorinsky term stands in for them.<br><br>
   <b>What to trust.</b> Structure: where the sonic line sits, whether the flow separates
   inside the bell, the shock-diamond spacing in an under-expanded plume, how the base flow
   and the plume interact. The 1-D ideal numbers in the panel are exact for what they assume.
   The measured numbers are grid-dependent — use them to rank designs, not to quote thrust.`;

/* ==========================================================================
   Shareable links. State lives in the fragment rather than the query string:
   the fragment never reaches a server, and assigning location.hash works on
   file:// URLs, where Chrome throws on history.replaceState.
   Only values that differ from the defaults are written, so a typical link
   carries a handful of keys.
   ========================================================================== */
const URLKEY = {
  pcBar:'pc', Tc:'tc', riseMs:'rt', chamR:'cr', chamLen:'cl',
  throatR:'tr', nozExitR:'er', convLen:'vl', divLen:'dl', nozShape:'ns',
  noseType:'nt', noseLen:'nl', foreLen:'fl', wallT:'wt',
  pAmbLog:'pa', tAmb:'ta', vAmb:'va',
  gamma:'ga', Rgas:'rg', visc:'nu', smag:'cs', dyeDiss:'dd',
  downrange:'dn', rDomain:'rd', zAspect:'za', res:'rs', cfl:'cf', budget:'bg', spf:'sp',
  probe:'pb',
  vidFlight:'vf', vidMsPerFrame:'vm', vidFps:'vr', vidWidth:'vw', vidMbps:'vb',
};
const URLKEY_INV = Object.fromEntries(Object.entries(URLKEY).map(([a,b]) => [b,a]));
const trimNum = v => String(Number(v.toFixed(5)));

function encodeState(){
  const out = [];
  for (const k in URLKEY){
    // compare at the control's own granularity: a default that is not exactly representable
    // on its slider would otherwise appear in every link
    if (Math.abs(P[k] - DEFAULTS[k]) > (SPEC[k].step || 1e-9) * 0.5)
      out.push(URLKEY[k] + '=' + trimNum(P[k]));
  }
  if (!OPT.autoPace)         out.push('ap=0');
  if (VIEW.field !== 0)      out.push('fd=' + VIEW.field);
  if (Math.abs(VIEW.gain - 1) > 1e-6) out.push('gn=' + trimNum(VIEW.gain));
  if (!VIEW.showGeom)        out.push('gm=0');
  if (OPT.format !== 'mp4')  out.push('vc=' + OPT.format);
  return out.join('&');
}

/* Returns true if anything was applied, so the caller knows to rebuild. */
function applyStateFromURL(){
  const raw = (location.hash || '').replace(/^#/, '') || (location.search || '').replace(/^\?/, '');
  if (!raw) return false;
  let any = false;
  for (const pair of raw.split('&')){
    const i = pair.indexOf('=');
    if (i < 0) continue;
    const key = decodeURIComponent(pair.slice(0, i));
    const val = decodeURIComponent(pair.slice(i + 1));
    const num = parseFloat(val);
    const pk = URLKEY_INV[key];
    if (pk && Number.isFinite(num)){
      const sp = SPEC[pk];
      P[pk] = Math.min(sp.max, Math.max(sp.min, num));   // clamp: links can be hand-edited
      if (sp.choices) P[pk] = Math.round(P[pk]);
      any = true;
    }
    else if (key === 'ap'){ OPT.autoPace = num !== 0; any = true; }
    else if (key === 'fd' && num >= 0 && num <= 7){ VIEW.field = Math.round(num); any = true; }
    else if (key === 'gn' && Number.isFinite(num) && num > 0){
      VIEW.gain = Math.min(32, Math.max(0.06, num)); any = true;
    }
    else if (key === 'gm'){ VIEW.showGeom = num !== 0; any = true; }
    else if (key === 'vc' && VIDEO_FORMATS[val]){ OPT.format = val; any = true; }
  }
  return any;
}

function pushStateToDOM(){
  syncSliders();
  if (UI.fieldSel) UI.fieldSel.value = String(VIEW.field);
  if (UI.geomChk)  UI.geomChk.checked = VIEW.showGeom;
  if (UI.gainIn){
    UI.gainIn.value = Math.log10(VIEW.gain);
    UI.gainOut.textContent = VIEW.gain.toFixed(VIEW.gain < 1 ? 2 : 1) + '×';
  }
  if (UI.fmtSel) UI.fmtSel.value = OPT.format;
  const ac = document.getElementById('autoPace'); if (ac) ac.checked = OPT.autoPace;
}

let urlTimer = 0, selfNav = false;

function writeURL(push){
  const q = encodeState();
  const url = q ? '#' + q : location.pathname + location.search;
  selfNav = true;
  try { push ? history.pushState(null, '', url) : history.replaceState(null, '', url); }
  catch (e) { location.hash = q; }          // file:// rejects pushState in some browsers
  setTimeout(() => { selfNav = false; }, 0);
  const el = document.getElementById('urlLen');
  if (el) el.textContent = (location.href || '').length + ' chars';
}

function scheduleURLSync(push){
  clearTimeout(urlTimer);
  if (push){ writeURL(true); return; }
  urlTimer = setTimeout(() => writeURL(false), 250);
}

/* Back and forward must actually restore the configuration, and restart the run — otherwise
   you are looking at one nozzle's flow inside another nozzle's geometry. */
function onHistoryNav(){
  clearTimeout(urlTimer);
  Object.assign(P, DEFAULTS);               // clear first: the target URL may omit keys
  OPT.autoPace = true;
  VIEW.field = 0; VIEW.gain = 1; VIEW.showGeom = true;
  applyStateFromURL();
  pushStateToDOM();
  pendingRebuild = false;
  buildGrid();
  S.running = true; DOM.pause.textContent = 'Pause';
  const el = document.getElementById('urlLen');
  if (el) el.textContent = (location.href || '').length + ' chars';
  updateMetrics();
}
window.addEventListener('popstate', onHistoryNav);
window.addEventListener('hashchange', () => { if (!selfNav) onHistoryNav(); });

/* ---- buttons & keys ---- */
document.getElementById('fire').addEventListener('click', () => {
  if (pendingRebuild){ buildGrid(); pendingRebuild = false; } else resetSim();
  S.running = true; S.spfAuto = 32; DOM.pause.textContent = 'Pause';
});
document.getElementById('reset').addEventListener('click', () => {
  buildGrid(); pendingRebuild = false;
});
DOM.pause.addEventListener('click', e => {
  if (S.diverged) return;
  S.running = !S.running; e.target.textContent = S.running ? 'Pause' : 'Run';
});
document.getElementById('share').addEventListener('click', async e => {
  clearTimeout(urlTimer);
  writeURL(false);
  const url = location.href;
  const done = ok => {
    // the hash is already written, so if the clipboard is unavailable (no secure context,
    // e.g. opened over file://) the link is still sitting in the address bar
    e.target.textContent = ok ? 'Link copied ✓' : 'It’s in the address bar';
    setTimeout(() => e.target.textContent = 'Copy shareable link', 2200);
  };
  try { await navigator.clipboard.writeText(url); done(true); }
  catch (err) {
    const ta = document.createElement('textarea');
    ta.value = url; document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) {}
    document.body.removeChild(ta); done(ok);
  }
});

document.getElementById('defaults').addEventListener('click', () => {
  Object.assign(P, DEFAULTS);
  OPT.autoPace = true;
  VIEW.field = 0; VIEW.gain = 1; VIEW.showGeom = true;
  pushStateToDOM(); buildGrid(); pendingRebuild = false;
  scheduleURLSync(true); updateMetrics();
});

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'Enter'){ document.getElementById('fire').click(); e.preventDefault(); }
  if (e.key === ' ')    { document.getElementById('pause').click(); e.preventDefault(); }
});

/* ========================== main loop ========================== */
const hud = document.getElementById('hud');
let lastWall = performance.now(), lastUi = 0, fps = 60;

function frame(){
  if (pendingRebuild && !S.running){ buildGrid(); pendingRebuild = false; }

  if (S.running && !S.diverged && !EXPORTING){
    if (pendingRebuild){ buildGrid(); pendingRebuild = false; }
    const n = OPT.autoPace ? Math.max(1, Math.round(S.spfAuto)) : P.spf;
    S.frameDt = compSteps(n);
    S.dt = compChooseDt();
  }
  if (!EXPORTING) render();

  const now = performance.now();
  const wall = Math.min(Math.max(now - lastWall, 1), 500);
  lastWall = now;
  S.wallSmooth += (wall - S.wallSmooth) * 0.15;
  fps += ((1000/wall) - fps) * 0.1;
  S.simRate = S.frameDt * 1000 / Math.max(S.wallSmooth, 1);

  // Steer steps-per-frame towards the frame budget. The timestep varies by orders of
  // magnitude across the parameter space, so without this a small throat is a slideshow.
  if (OPT.autoPace && S.running && !S.diverged){
    if (S.wallSmooth > P.budget * 1.15)      S.spfAuto = Math.max(1, S.spfAuto * 0.85);
    else if (S.wallSmooth < P.budget * 0.85) S.spfAuto = Math.min(1024, S.spfAuto * 1.10);
  }

  // The plot and the metrics panel are DOM work; at 60 Hz they cost more than the solver.
  if (now - lastUi > 90){
    lastUi = now;
    drawPlot();
    drawLegend(S.colourScale || 1);
    updateMetrics();
    DOM.scalebar.textContent =
      `domain ${S.Lz.toFixed(0)} × ${(2*S.Rmax).toFixed(0)} mm   grid ${S.Nz} × ${S.Nr}   ` +
      `cell ${S.dz.toFixed(2)} × ${S.dr.toFixed(2)} mm`;
  }

  const steps = OPT.autoPace ? Math.max(1, Math.round(S.spfAuto)) : P.spf;
  const C = chamberState(S.t);
  hud.textContent =
    `t = ${S.t.toFixed(3)} ms   dt = ${(S.dt*1e6).toFixed(2)} ns   ` +
    `max Mach ${CP.machMax.toFixed(2)}   peak |u| ${S.vmax.toFixed(0)} m/s\n` +
    `chamber ${(C.p/1e5).toFixed(2)} bar   ${C.T.toFixed(0)} K` +
    (S.t < P.riseMs ? '   ▲ ramping' : '   ■ steady') + `\n` +
    `${fps.toFixed(0)} fps   ${steps} steps/frame   ` +
    `${S.simRate.toFixed(2)} ms of flight per second\n` +
    `compressible Navier–Stokes (HLLC / MUSCL / SSP-RK2)   ` +
    `${(steps*6).toLocaleString()} dispatches/frame, 1 submit`;

  requestAnimationFrame(frame);
}

function flagDivergence(v){
  S.diverged = true; S.running = false;
  DOM.pause.textContent = 'Run';
  const el = document.getElementById('diverged');
  el.style.display = 'block';
  el.innerHTML = `<b>The run diverged.</b> The wave-speed reduction came back as ` +
    (Number.isFinite(v) ? `${v.toFixed(0)}` : 'a non-finite value') +
    `. Almost always this is a positivity failure at a sharp corner under a very large ` +
    `pressure ratio. Lower the <b>CFL number</b>, lengthen the <b>ignition rise time</b>, ` +
    `or raise the radial resolution so the throat is better resolved — then ignite again.`;
}

(async function boot(){
  await wgpuInit();
  await compInit();
  applyStateFromURL();
  pushStateToDOM();
  updateExportDerived();
  buildGrid();
  scheduleURLSync();
  updateMetrics();
  requestAnimationFrame(frame);
})().catch(e => console.error(e));
</script>
</body>
