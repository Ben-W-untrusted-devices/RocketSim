<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocket Sim — axisymmetric nozzle &amp; plume sandbox</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232c; --line:#2b3440;
    --fg:#dfe6ee; --dim:#8b97a6; --accent:#5ec6ff; --warn:#ffb454; --bad:#ff6b6b; --good:#7ee787;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--fg);
    font:13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display:flex; overflow:hidden;
  }
  #stage{flex:1 1 auto; display:flex; flex-direction:column; min-width:0; padding:10px; gap:8px}
  #viewWrap{flex:1 1 auto; position:relative; min-height:0; background:#05070a;
            border:1px solid var(--line); border-radius:8px; overflow:hidden;
            display:flex; align-items:center; justify-content:center}
  #viewgpu{display:block; max-width:100%; max-height:100%; image-rendering:auto}
  #hud{position:absolute; left:10px; top:8px; font:11px/1.4 var(--mono); color:#9fb2c4;
       text-shadow:0 1px 3px #000; pointer-events:none; white-space:pre}
  #scalebar{position:absolute; right:10px; bottom:8px; font:11px var(--mono); color:#9fb2c4;
            text-shadow:0 1px 3px #000; pointer-events:none}
  #legend{position:absolute; left:10px; bottom:8px; pointer-events:none;
          width:220px; height:38px}
  #bottom{flex:0 0 190px; display:flex; gap:10px; align-items:stretch; min-height:190px}
  #plotBox{flex:1 1 auto; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 8px}
  #plot{width:100%; height:110px; display:block}
  #plotTitle{font:11px var(--mono); color:var(--dim); margin-bottom:2px}
  #metrics{flex:0 0 330px; background:var(--panel); border:1px solid var(--line);
           border-radius:8px; padding:8px 10px; font:11.5px/1.5 var(--mono); overflow:auto}
  #metrics .row{display:flex; justify-content:space-between; gap:8px}
  #metrics .k{color:var(--dim)}
  #metrics .v{color:var(--fg); text-align:right}
  #metrics h4{margin:0 0 4px; font:600 11px/1.4 var(--mono); color:var(--accent);
              letter-spacing:.08em; text-transform:uppercase}
  #metrics hr{border:0; border-top:1px solid var(--line); margin:7px 0}
  #metrics .void{opacity:.4}
  #metrics .void .v{text-decoration:line-through}
  #metrics .void h4{color:var(--bad)}

  #panel{flex:0 0 340px; background:var(--panel); border-left:1px solid var(--line);
         overflow-y:auto; padding:10px 12px 40px}
  #panel h1{font-size:14px; margin:2px 0 2px; letter-spacing:.02em}
  #panel .sub{color:var(--dim); font-size:11px; margin-bottom:10px}
  details{border:1px solid var(--line); border-radius:7px; margin-bottom:8px; background:var(--panel2)}
  details>summary{cursor:pointer; padding:7px 10px; font-weight:600; font-size:12px;
                  letter-spacing:.04em; text-transform:uppercase; color:var(--accent); list-style:none}
  details>summary::-webkit-details-marker{display:none}
  details>summary::before{content:"▸ "; color:var(--dim)}
  details[open]>summary::before{content:"▾ "}
  .body{padding:4px 10px 10px}
  .ctl{margin:8px 0}
  .ctl .lab{display:flex; justify-content:space-between; align-items:baseline; gap:6px}
  .ctl .lab span:first-child{color:var(--fg)}
  .ctl .lab span:last-child{font:11px var(--mono); color:var(--accent)}
  .ctl input[type=range]{width:100%; margin:3px 0 0; accent-color:var(--accent)}
  .ctl .hint{font-size:10.5px; color:var(--dim); margin-top:1px}
  .rebuild .lab span:first-child::after{content:" ↻"; color:var(--dim); font-size:10px}
  select,button{font:inherit; background:var(--panel2); color:var(--fg);
                border:1px solid var(--line); border-radius:6px; padding:5px 8px}
  select{width:100%}
  button{cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:#1d4763; border-color:#2d6d95; color:#dff1ff; font-weight:600}
  .btnrow{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0}
  .btnrow button{flex:1 1 auto}
  .presets button{flex:1 1 45%; font-size:11.5px; text-align:left; padding:6px 8px; line-height:1.3}
  .presets button b{display:block; color:var(--accent); font-size:11.5px}
  .presets button.active{background:#1d4763; border-color:#5ec6ff}
  .pbar{height:6px; background:#0e1116; border:1px solid var(--line); border-radius:4px;
        overflow:hidden; margin:8px 0 4px}
  .pbar>div{height:100%; width:0%; background:linear-gradient(90deg,#2d6d95,#5ec6ff);
            transition:width .12s linear}
  .presets button.active b{color:#dff1ff}
  .presets button i{font-style:normal; color:var(--dim); font-size:10.5px}
  label.chk{display:flex; align-items:center; gap:6px; margin:6px 0; cursor:pointer}
  #note{font-size:11px; color:var(--dim); margin-top:10px; line-height:1.5}
  .flag{margin-top:6px; padding:6px 8px; border-radius:6px; font-size:11px; line-height:1.45}
  .flag.warn{background:#3a2a10; border:1px solid #6b4a15; color:#ffd79a}
  .flag.bad{background:#3a1616; border:1px solid #6b2020; color:#ffb3b3}
  .flag.good{background:#12301a; border:1px solid #235c33; color:#b6f0c4}
  #err{position:fixed; inset:0; background:#0e1116ee; color:#ffb3b3; padding:40px;
       font:14px/1.6 var(--mono); display:none; z-index:99; white-space:pre-wrap}
</style>
</head>
<body>
<div id="stage">
  <div id="viewWrap">
    <canvas id="viewgpu"></canvas>
    <div id="hud"></div>
    <canvas id="legend" width="440" height="76"></canvas>
    <div id="scalebar"></div>
  </div>
  <div id="bottom">
    <div id="plotBox">
      <div id="plotTitle"></div>
      <canvas id="plot"></canvas>
    </div>
    <div id="metrics"></div>
  </div>
</div>
<div id="panel">
  <h1>Rocket Sim</h1>
  <div class="sub">Axisymmetric (r–z) compressible Navier–Stokes. A hot-gas injector feeds a
  combustion chamber and a parametric converging–diverging nozzle; the vehicle flies nose-first
  into a freestream of your choosing. The view is a slice through the axis.</div>
  <div class="btnrow">
    <button id="fire" class="primary">Ignite ⏎</button>
    <button id="pause">Pause</button>
    <button id="reset">Reset</button>
  </div>
  <div class="btnrow">
    <button id="share">Copy shareable link</button>
    <button id="defaults">Reset to defaults</button>
  </div>
  <div class="hint" style="margin:-4px 0 8px">Every physical setting lives in the link —
    <span id="urlLen">…</span>.</div>
  <div id="diverged" class="flag bad" style="display:none"></div>
  <div id="controls"></div>
  <div id="note"></div>
</div>
<div id="err"></div>

<script>
"use strict";
/* ==========================================================================
   Rocket Sim — axisymmetric compressible flow around a rocket's aft end.
   --------------------------------------------------------------------------
   Coordinates: p = (z, r).  z runs nose-to-tail, r is radial, r >= 0.
   The vehicle sits nose-first in a freestream blowing in +z, so in this frame
   ambient air enters at z = 0, flows over the nose cone and the body, and
   meets the exhaust plume at the base. Exhaust leaves the nozzle in +z.

   Units: millimetres, milliseconds, and SI for everything thermodynamic
   (kelvin, pascal, kg/m^3). 1 mm/ms == 1 m/s, which is why the geometry can
   be in millimetres and the velocities still read as metres per second.
   ========================================================================== */

/* ========================== parameters ========================== */
const CONTROLS = [
 { group:'Chamber & injector', open:true, items:[
   { k:'pcBar',   t:'Chamber pressure',      min:1,   max:300, step:1,   v:20,   unit:'bar',
     hint:'Stagnation pressure held at the injector face. The nozzle chokes once this is ' +
          'above about 1.9× ambient; everything downstream scales with the ratio, not the value.' },
   { k:'Tc',      t:'Chamber temperature',   min:300, max:4000,step:25,  v:3000, unit:'K',
     hint:'Stagnation temperature of the injected gas. Sets the sound speed, and with it both ' +
          'the exhaust velocity and the timestep.' },
   { k:'riseMs',  t:'Ignition rise time',    min:0.01,max:20,  step:0.01,v:0.5,  unit:'ms',
     hint:'Chamber conditions ramp from ambient to full over this long, smoothstep in time. ' +
          'A step change is legal but launches a much stronger starting shock.' },
   { k:'chamR',   t:'Chamber radius',        min:5,   max:60,  step:0.5, v:25,   unit:'mm', rebuild:true },
   { k:'chamLen', t:'Chamber length',        min:10,  max:200, step:1,   v:50,   unit:'mm', rebuild:true,
     hint:'Only the gas dynamics are modelled — no injector elements, no combustion, no ' +
          'characteristic length. The head end is simply held at stagnation conditions.' },
 ]},
 { group:'Nozzle', open:true, items:[
   { k:'throatR',  t:'Throat radius',        min:1,  max:40,  step:0.25, v:8,    unit:'mm', rebuild:true,
     hint:'The single most important number here. Mass flow is proportional to throat area ' +
          'once choked, and the grid needs ≳6 cells across the throat radius to mean anything.' },
   { k:'nozExitR', t:'Exit radius',          min:1,  max:80,  step:0.25, v:13.5, unit:'mm', rebuild:true,
     hint:'With the throat, this fixes the expansion ratio and therefore the design altitude.' },
   { k:'convLen',  t:'Converging length',    min:2,  max:120, step:1,    v:20,   unit:'mm', rebuild:true,
     hint:'Contour is a raised cosine, so it meets both the chamber wall and the throat with ' +
          'zero slope. Subsonic flow here is forgiving; the shape barely matters.' },
   { k:'divLen',   t:'Diverging length',     min:2,  max:250, step:1,    v:25,   unit:'mm', rebuild:true,
     hint:'Sets the divergence half-angle, and with it the cosine loss and the risk of ' +
          'separation. 12–18° is the usual conical range.' },
   { k:'nozShape', t:'Divergent contour',    min:0,  max:1,   step:1,    v:1,    rebuild:true,
     choices:['Conical (straight)','Bell (parabolic)'],
     hint:'Conical is a straight line from throat to exit. Bell turns the flow hard just past ' +
          'the throat and axially at the exit, recovering most of the cosine loss in less length.' },
 ]},
 { group:'Airframe', open:true, items:[
   { k:'noseType', t:'Nose cone',            min:0,  max:2,   step:1,    v:2,    rebuild:true,
     choices:['Flat (blunt cylinder)','Pointy (conical)','Rounded (ellipsoidal)'],
     hint:'Only matters with a freestream. Flat gives a detached bow shock and a big subsonic ' +
          'pocket; pointy gives an attached oblique shock above its own Mach angle; rounded ' +
          'is the low-drag compromise that most real vehicles fly.' },
   { k:'noseLen',  t:'Nose cone length',     min:5,  max:300, step:1,    v:55,   unit:'mm', rebuild:true,
     hint:'Ignored when the nose is flat.' },
   { k:'foreLen',  t:'Forebody length',      min:0,  max:400, step:1,    v:40,   unit:'mm', rebuild:true,
     hint:'Solid body between the nose base and the injector face — tankage, in a real vehicle.' },
   { k:'wallT',    t:'Wall thickness',       min:0.5,max:20,  step:0.5,  v:3,    unit:'mm', rebuild:true,
     hint:'Body radius is max(chamber, nozzle exit) + this, so the base is always an annulus.' },
 ]},
 { group:'Environment', open:true, items:[
   { k:'pAmbLog',  t:'Ambient pressure',     min:-2, max:2.1, step:0.05, v:2,    log:true, unit:'kPa',
     hint:'Logarithmic: 100 kPa is sea level, 26 kPa ≈ 10 km, 1 kPa ≈ 31 km, 0.01 kPa ≈ 65 km. ' +
          'The nozzle is only right at one of these.' },
   { k:'tAmb',     t:'Ambient temperature',  min:150,max:330, step:1,    v:288,  unit:'K',
     hint:'Sets ambient density and sound speed, and therefore the freestream Mach number.' },
   { k:'vAmb',     t:'Ambient air speed',    min:0,  max:1500,step:5,    v:0,    unit:'m/s',
     hint:'Flight speed. In the vehicle frame this is air entering at the nose and washing ' +
          'down the body into the base region, where it shears against the plume.' },
 ]},
 { group:'Gas', items:[
   { k:'gamma',    t:'Ratio of specific heats γ', min:1.1, max:1.67, step:0.01, v:1.4,
     hint:'ONE gas fills the whole domain, ambient and exhaust alike. Air is 1.4; rocket ' +
          'exhaust is nearer 1.2. Lowering it makes the plume expand like combustion products ' +
          'but also makes the "air" outside stop being air.' },
   { k:'Rgas',     t:'Specific gas constant R', min:150, max:600, step:1, v:287, unit:'J/kg·K',
     hint:'Air is 287; kerolox exhaust is around 350–380, hydrolox around 690 (off this ' +
          'slider). Same caveat: it applies everywhere.' },
   { k:'visc',     t:'Kinematic viscosity',  min:0, max:1, step:0.0001, v:0.0151, unit:'mm²/ms',
     hint:'Air at 20 °C = 0.0151. Constant, not Sutherland — the boundary layers here are ' +
          'unresolved anyway.' },
   { k:'smag',     t:'Turbulence model (Smagorinsky Cs)', min:0, max:0.45, step:0.005, v:0.17,
     hint:'Stands in for the 3-D mixing that axial symmetry forbids. Without it the shear ' +
          'layer between plume and freestream stays laminar and refuses to spread.' },
   { k:'dyeDiss',  t:'Exhaust tracer fade',  min:0, max:0.05, step:0.001, v:0, unit:'/ms' },
 ]},
 { group:'Domain & solver', items:[
   { k:'downrange', t:'Plume domain',        min:50, max:1500,step:10,   v:300,  unit:'mm', rebuild:true,
     hint:'How far past the nozzle exit plane the domain runs.' },
   { k:'rDomain',   t:'Radial domain',       min:1.5,max:6,   step:0.25, v:2.5,  rebuild:true,
     unit:'× body radius',
     hint:'How far out the domain reaches. Wider is safer for a bow shock and for the plume ' +
          'spreading, but the radial cell count is fixed, so wider also means coarser — and ' +
          'the throat is what suffers first. Watch the throat resolution below.' },
   { k:'zAspect',   t:'Axial cell stretch',  min:1,  max:4,   step:0.25, v:2,    rebuild:true,
     hint:'Axial cell size as a multiple of radial. The plume is long and thin, and the ' +
          'timestep is set by the axial wave speed, so stretching buys speed nearly free. ' +
          'Drop to 1 when you care about shock-cell spacing.' },
   { k:'res',       t:'Radial cells',        min:48, max:352, step:16,   v:112,  rebuild:true,
     hint:'Cost is roughly linear in this, not quadratic — the timestep shrinks with the cell ' +
          'size, so a finer grid costs twice over. Check the throat resolution in the panel.' },
   { k:'cfl',       t:'CFL number',          min:0.1,max:0.6, step:0.02, v:0.4,
     hint:'MUSCL + SSP-RK2 is stable to about 0.6 here and the slider stops there. Lower it ' +
          'if a strong starting shock trips the positivity floors.' },
   { k:'budget',    t:'Frame budget',        min:8,  max:120, step:2,    v:30,   unit:'ms',
     hint:'With auto-pacing on, steps per frame are tuned to hit this.' },
   { k:'spf',       t:'Steps / frame (manual)', min:1, max:800, step:1,  v:120,
     hint:'Only used when auto-pacing is off.' },
 ]},
 { group:'Video export', items:[
   { k:'vidFlight',     t:'Flight time to record', min:0.1, max:100, step:0.1, v:6, unit:'ms' },
   { k:'vidMsPerFrame', t:'Flight time per frame', min:0.002, max:1, step:0.002, v:0.02, unit:'ms',
     hint:'Constant by construction: every frame advances exactly this much, subdivided into ' +
          'as many equal sub-steps as stability needs. The adaptive timestep is switched off.' },
   { k:'vidFps',        t:'Video frame rate',   min:12, max:60, step:1, v:30, unit:'fps' },
   { k:'vidWidth',      t:'Video width',        min:480, max:1920, step:80, v:1280, unit:'px' },
   { k:'vidMbps',       t:'Bitrate',            min:1, max:40, step:1, v:12, unit:'Mb/s' },
 ]},
 { group:'Measurement', items:[
   { k:'probe',    t:'Measurement plane, past the exit', min:0, max:1000, step:5, v:0, unit:'mm',
     hint:'At 0 this is the nozzle exit plane, where the momentum-plus-pressure integral is ' +
          'the thrust. Move it downstream to watch the plume instead.' },
 ]},
];

const P = {};
for (const g of CONTROLS) for (const it of g.items) P[it.k] = it.v;
const DEFAULTS = Object.assign({}, P);
const SPEC = {};
for (const g of CONTROLS) for (const it of g.items) SPEC[it.k] = it;
const VIEW = { field:0, gain:1, showGeom:true };
const OPT = { autoPace:true, format:'mp4' };

const G0 = 9.80665;

/* ========================== environment & chamber ========================== */
const pAmbPa = () => Math.pow(10, P.pAmbLog) * 1000;

function env(){
  const g = P.gamma, Rg = P.Rgas, pa = pAmbPa(), Ta = P.tAmb;
  const rhoA = pa / (Rg * Ta);
  const aA = Math.sqrt(g * Rg * Ta);
  return { g, Rg, pa, Ta, rhoA, aA, vInf:P.vAmb, machInf:P.vAmb / aA };
}

/* The chamber is a plenum held at stagnation conditions, ramped in over `riseMs` so the
   run does not begin with a discontinuity the size of the pressure ratio. */
function chamberState(t){
  const E = env();
  const s = P.riseMs <= 0 ? 1 : Math.min(1, Math.max(0, t / P.riseMs));
  const sm = s * s * (3 - 2 * s);
  const p = E.pa + (P.pcBar * 1e5 - E.pa) * sm;
  const T = E.Ta + (P.Tc - E.Ta) * sm;
  return { p, T, rho: p / (E.Rg * T) };
}

/* ========================== geometry ==========================
   Everything the shaders need to draw and to classify a point, computed once per rebuild
   so the JS metrics and the GPU geometry cannot drift apart. */
const GEO = {};
function computeGeometry(){
  const noseLen  = (P.noseType === 0) ? 0 : P.noseLen;
  const throatR  = Math.min(P.throatR, P.chamR - 0.5);
  const nozExitR = Math.max(P.nozExitR, throatR);
  const bodyR    = Math.max(P.chamR, nozExitR) + P.wallT;
  const vehLen   = noseLen + P.foreLen + P.chamLen + P.convLen + P.divLen;

  let zNose = Math.max(2.5 * bodyR, 20);
  let Lz    = zNose + vehLen + P.downrange;
  zNose     = Math.max(zNose, 0.13 * Lz);        // clear of the inlet sponge
  Lz        = zNose + vehLen + P.downrange;

  const zShoulder = zNose + noseLen;
  const zInj      = zShoulder + P.foreLen;
  const zConv0    = zInj + P.chamLen;
  const zThroat   = zConv0 + P.convLen;
  const zExit     = zThroat + P.divLen;
  const Rmax      = Math.max(P.rDomain * bodyR, bodyR + 25);
  return Object.assign(GEO, { noseLen, throatR, nozExitR, bodyR, vehLen,
                              zNose, zShoulder, zInj, zConv0, zThroat, zExit, Lz, Rmax });
}

/* ========================== 1-D isentropic reference ==========================
   These are the numbers the design actually rests on. The CFD is there to show what the
   1-D theory cannot: separation, shock structure, base flow, plume shear. */
function areaRatio(M, g){
  return (1 / M) * Math.pow((2 / (g + 1)) * (1 + (g - 1) / 2 * M * M),
                            (g + 1) / (2 * (g - 1)));
}
/* Supersonic branch, by bisection: areaRatio is monotonic above M = 1. */
function machFromArea(eps, g){
  if (!(eps > 1 + 1e-7)) return 1;
  let lo = 1, hi = 60;
  for (let i = 0; i < 90; i++){
    const m = 0.5 * (lo + hi);
    if (areaRatio(m, g) < eps) lo = m; else hi = m;
  }
  return 0.5 * (lo + hi);
}
const machFromPressureRatio = (p0OverP, g) =>
  Math.sqrt(Math.max(0, 2 / (g - 1) * (Math.pow(p0OverP, (g - 1) / g) - 1)));

function derived(){
  const E = env(), g = E.g, Rg = E.Rg;
  const rt = GEO.throatR || P.throatR, re = GEO.nozExitR || P.nozExitR;
  const At = Math.PI * rt * rt, Ae = Math.PI * re * re;      // mm²
  const eps = Ae / At;
  const pc = P.pcBar * 1e5, Tc = P.Tc;

  const critical = Math.pow((g + 1) / 2, g / (g - 1));       // 1.893 for air
  const choked = pc / E.pa >= critical;

  const Me = machFromArea(eps, g);
  const pe = pc * Math.pow(1 + (g - 1) / 2 * Me * Me, -g / (g - 1));
  const Te = Tc / (1 + (g - 1) / 2 * Me * Me);
  const ve = Me * Math.sqrt(g * Rg * Te);
  const peRatio = pe / E.pa;

  // choked mass flow: pc·At·sqrt(γ/RT₀)·(2/(γ+1))^((γ+1)/2(γ-1))
  const mdot = choked
    ? pc * (At * 1e-6) * Math.sqrt(g / (Rg * Tc)) *
      Math.pow(2 / (g + 1), (g + 1) / (2 * (g - 1)))
    : 0;
  const thrust = mdot * ve + (pe - E.pa) * (Ae * 1e-6);
  const cf   = thrust / (pc * At * 1e-6);
  const isp  = mdot > 0 ? thrust / (mdot * G0) : 0;
  const cstar= mdot > 0 ? pc * (At * 1e-6) / mdot : 0;

  // divergence half-angle and the cosine loss it costs a conical nozzle
  const halfAngle = Math.atan2(re - rt, Math.max(P.divLen, 1e-6)) * 180 / Math.PI;
  const lambda = P.nozShape === 0
    ? 0.5 * (1 + Math.cos(halfAngle * Math.PI / 180))
    : 0.99;                                                  // a bell recovers most of it

  // the expansion ratio that would be perfect at this ambient pressure
  const MeOpt = machFromPressureRatio(pc / E.pa, g);
  const epsOpt = MeOpt > 1 ? areaRatio(MeOpt, g) : 1;
  const reOpt = rt * Math.sqrt(epsOpt);

  // vacuum ceiling: all of the enthalpy turned into speed
  const cp = g * Rg / (g - 1);
  const vMax = Math.sqrt(2 * cp * Tc);

  return { g, Rg, rt, re, At, Ae, eps, pc, Tc, pa:E.pa, choked, critical,
           Me, pe, Te, ve, peRatio, mdot, thrust, cf, isp, cstar,
           halfAngle, lambda, MeOpt, epsOpt, reOpt, vMax,
           machInf:E.machInf, aAmb:E.aA, rhoAmb:E.rhoA };
}


const PRESETS = [
 { n:'Sea-level booster', d:'ε ≈ 2.8, sized for 100 kPa',
   p:{ pcBar:20, Tc:3000, throatR:8, nozExitR:13.5, divLen:25, convLen:20, nozShape:1,
       pAmbLog:2, vAmb:0 } },
 { n:'Vacuum upper stage', d:'ε ≈ 40, fired at 1 kPa',
   p:{ pcBar:20, Tc:3000, throatR:8, nozExitR:50.5, divLen:110, convLen:20, nozShape:1,
       pAmbLog:0, vAmb:0 } },
 { n:'Over-expanded', d:'the vacuum bell at sea level',
   p:{ pcBar:20, Tc:3000, throatR:8, nozExitR:50.5, divLen:110, convLen:20, nozShape:1,
       pAmbLog:2, vAmb:0 } },
 { n:'Under-expanded', d:'stubby nozzle, shock diamonds',
   p:{ pcBar:60, Tc:3000, throatR:8, nozExitR:10, divLen:12, convLen:20, nozShape:0,
       pAmbLog:2, vAmb:0 } },
 { n:'Supersonic flight', d:'Mach 2 at 10 km, base flow',
   p:{ pcBar:40, Tc:3000, throatR:8, nozExitR:20, divLen:45, convLen:20, nozShape:1,
       pAmbLog:1.4, tAmb:223, vAmb:600, noseType:1 } },
 { n:'Cold gas thruster', d:'no combustion, 300 K nitrogen-ish',
   p:{ pcBar:10, Tc:300, throatR:8, nozExitR:20, divLen:45, convLen:20, nozShape:1,
       pAmbLog:0, vAmb:0 } },
];

/* ========================== simulation state ========================== */
const S = {
  Nz:0, Nr:0, dz:0, dr:0, Lz:0, Rmax:0,
  t:0, running:true, dt:0.001,
  vmax:1, frameDt:0,
  series:[], peak:0, peakT:-1,
  spfAuto:32, wallSmooth:16, simRate:0, diverged:false,
  colourScale:1, meas:null,
};
var FIXED_DT = null, EXPORTING = false;

function buildGrid(){
  computeGeometry();
  S.Lz = GEO.Lz; S.Rmax = GEO.Rmax;
  S.Nr = Math.round(P.res);
  S.dr = S.Rmax / S.Nr;
  S.Nz = Math.max(64, Math.min(3000, Math.round(S.Lz / (S.dr * P.zAspect))));
  S.dz = S.Lz / S.Nz;
  compAlloc();
  resizeCanvas();
  resetSim();
}

function resetSim(){
  S.t = 0; S.dt = 0.001;
  S.series.length = 0; S.peak = 0; S.peakT = -1; S.vmax = 1; S.meas = null;
  S.diverged = false;
  const d = document.getElementById('diverged');
  if (d) d.style.display = 'none';
  compReset();
}

function probeIz(){
  // stop short of the outflow sponge: inside it the state is being relaxed to ambient
  const zP = Math.min(S.Lz * 0.90, GEO.zExit + P.probe);
  return { zP, iz: Math.max(0, Math.min(S.Nz - 1, Math.round(zP / S.dz))) };
}

/* ---- turn the probe-plane column into the headline numbers ----
   The buffer is (u_z, rho, p, Mach, Y) per radial cell, stride 8.

   Two different mass flows cross this plane and conflating them is the easy mistake. The
   integral of rho*u_z counts entrained ambient air, which in a separated nozzle can be
   larger than the propellant flow itself; weighting by the exhaust mass fraction Y is what
   compares against the choked-throat figure. The momentum-plus-pressure integral is over
   the nozzle exit area only — further out the plane cuts freestream, whose momentum is not
   thrust. */
function consumeProbeArr(buf, t){
  const pa = pAmbPa(), rLim = GEO.nozExitR;
  let axis = 0, mx = 0, mdot = 0, mdotAll = 0, thrust = 0, machMax = 0;
  for (let ir = 0; ir < S.Nr; ir++){
    const uz = buf[ir*8], rho = buf[ir*8+1], pr = buf[ir*8+2],
          M = buf[ir*8+3], Y = buf[ir*8+4];
    if (!Number.isFinite(uz) || !Number.isFinite(rho)) continue;
    if (ir === 0) axis = uz;
    if (Math.abs(uz) > Math.abs(mx)) mx = uz;
    if (M > machMax) machMax = M;
    const rc = (ir + 0.5) * S.dr;
    if (rc > rLim) continue;
    const dA = 2 * Math.PI * rc * S.dr * 1e-6;               // mm² -> m²
    mdot    += rho * uz * Y * dA;                             // kg/s of propellant
    mdotAll += rho * uz * dA;                                 // everything crossing the plane
    thrust  += (rho * uz * uz + (pr - pa)) * dA;              // N
  }
  S.meas = { axis, mx, mdot, mdotAll, thrust, machMax };
  if (mx > S.peak){ S.peak = mx; S.peakT = t; }
  S.series.push([t, axis, mx]);
  if (S.series.length > 4000) S.series.splice(0, 2000);
}

/* ========================== rendering ========================== */
function resizeCanvas(){
  const wrap = document.getElementById('viewWrap');
  const aspect = S.Lz / (2 * S.Rmax);
  let w = wrap.clientWidth - 2, h = wrap.clientHeight - 2;
  if (w / h > aspect) w = h * aspect; else h = w / aspect;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cv = WG.canvas;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.width  = Math.max(2, Math.round(w * dpr));
  cv.height = Math.max(2, Math.round(h * dpr));
}
window.addEventListener('resize', () => { if (S.Nz) resizeCanvas(); });
const render = () => compRender();

/* ========================== metrics ========================== */
const fmt = (x, d = 1) => (Number.isFinite(x) ? x.toFixed(d) : '—');
const fmtP = pa => pa >= 1e5 ? (pa/1e5).toFixed(2) + ' bar'
                 : pa >= 1e3 ? (pa/1e3).toFixed(2) + ' kPa'
                             : pa.toFixed(1) + ' Pa';

function updateMetrics(){
  const D = derived(), m = S.meas || { axis:0, mx:0, mdot:0, mdotAll:0, thrust:0, machMax:0 };
  const flags = [];
  const cellsAcrossThroat = D.rt / S.dr;

  if (!D.choked) flags.push(['bad',
    `<b>The nozzle is not choked.</b> Chamber pressure is only ${fmt(D.pc/D.pa,2)}× ambient, ` +
    `below the critical ratio of ${fmt(D.critical,2)} for γ = ${fmt(D.g,2)}. The throat stays ` +
    `subsonic, mass flow still responds to ambient pressure, and the divergent section acts as ` +
    `a diffuser rather than a nozzle. Raise the chamber pressure or drop the ambient.`]);
  else if (D.peRatio < 0.35) flags.push(['bad',
    `<b>Badly over-expanded — expect separation inside the bell.</b> Exit pressure is ` +
    `${fmt(D.peRatio,2)}× ambient; below about 0.35 (Summerfield) the boundary layer separates ` +
    `and the shock system moves inside the nozzle, which is a real structural load and not just ` +
    `a loss. The ideal thrust below assumes full flowing, so it is optimistic here. ` +
    `Optimum exit radius at this ambient is ${fmt(D.reOpt,1)} mm (ε = ${fmt(D.epsOpt,1)}).`]);
  else if (D.peRatio < 0.8) flags.push(['warn',
    `Over-expanded: exit pressure ${fmt(D.peRatio,2)}× ambient. Attached but lossy — oblique ` +
    `shocks stand at the lip. Optimum exit radius here is ${fmt(D.reOpt,1)} mm.`]);
  else if (D.peRatio > 2.5) flags.push(['warn',
    `Strongly under-expanded: exit pressure ${fmt(D.peRatio,1)}× ambient. The plume goes on ` +
    `expanding outside through a Prandtl–Meyer fan, then over-shoots into a Mach disc and a ` +
    `train of shock diamonds. Watch the schlieren field. A longer bell (exit radius ` +
    `${fmt(D.reOpt,1)} mm) would recover it.`]);
  else if (D.peRatio > 1.25) flags.push(['warn',
    `Mildly under-expanded: exit pressure ${fmt(D.peRatio,2)}× ambient.`]);
  else flags.push(['good',
    `Near-optimally expanded: exit pressure ${fmt(D.peRatio,2)}× ambient. This nozzle is ` +
    `matched to this altitude.`]);

  if (cellsAcrossThroat < 6) flags.push(['bad',
    `<b>The throat is ${fmt(cellsAcrossThroat,1)} cells across the radius.</b> Below about 6 the ` +
    `sonic line is not resolved and the mass flow is a grid artefact. Raise the radial cell ` +
    `count or the throat radius.`]);
  else if (cellsAcrossThroat < 10) flags.push(['warn',
    `Throat is ${fmt(cellsAcrossThroat,1)} cells across the radius — thin. Numbers will shift ` +
    `noticeably with resolution.`]);

  if (P.nozShape === 0 && D.halfAngle > 22) flags.push(['warn',
    `Conical half-angle is ${fmt(D.halfAngle,1)}°, costing ${fmt((1-D.lambda)*100,1)}% of the ` +
    `momentum to divergence alone, and steep enough that the flow may not follow the wall.`]);

  if (D.machInf > 0.8) flags.push(['warn',
    `Freestream is Mach ${fmt(D.machInf,2)}. The base region is now a genuine interaction: the ` +
    `external flow separates off the base annulus, the plume acts as an aerodynamic body, and ` +
    `base pressure — not modelled by any of the 1-D numbers above — moves the real thrust.`]);
  if (D.machInf > 1 && P.noseType === 0) flags.push(['warn',
    `A flat nose at Mach ${fmt(D.machInf,2)} gives a detached bow shock and a subsonic pocket ` +
    `that costs a lot of drag. It is the cheapest way to see a bow shock, and the worst way to fly.`]);

  flags.push(['warn',
    `<b>One gas, everywhere.</b> γ = ${fmt(D.g,2)} and R = ${fmt(D.Rg,0)} J/kg·K apply to the ` +
    `exhaust and to the ambient alike — there is no mixture model and no combustion. Real ` +
    `exhaust has γ ≈ 1.2 and R ≈ 350, which changes the expansion; setting those here makes ` +
    `the plume right and the atmosphere wrong. Pick whichever end you are studying.`]);
  flags.push(['warn',
    `The numbers above the line are 1-D isentropic theory and are exact for what they assume ` +
    `(no separation, no boundary layer, uniform exit). The measured block below comes from the ` +
    `grid and is not converged: treat it as ranking designs and as structure — where the shocks ` +
    `stand, whether the flow separates — not as absolute figures.`]);

  const rows = (title, list) => `<h4>${title}</h4>` + list.map(
    ([k,v]) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
  const critical = flags.filter(f => f[0] === 'bad');
  const rest     = flags.filter(f => f[0] !== 'bad');

  DOM.metrics.innerHTML =
    critical.map(([c,t]) => `<div class="flag ${c}">${t}</div>`).join('') +
    rows('Nozzle — 1-D ideal', [
      ['expansion ratio ε', fmt(D.eps,2) + ' : 1'],
      ['throat / exit R',   fmt(D.rt,2) + ' / ' + fmt(D.re,2) + ' mm'],
      ['half-angle',        fmt(D.halfAngle,1) + '°' + (P.nozShape === 0 ? ` (λ ${fmt(D.lambda,3)})` : ' at exit')],
      ['pressure ratio',    fmt(D.pc/D.pa,1) + ' : 1'],
      ['exit Mach',         fmt(D.Me,2)],
      ['exit pressure',     fmtP(D.pe) + ' (' + fmt(D.peRatio,2) + '× amb)'],
      ['exit temperature',  fmt(D.Te,0) + ' K'],
      ['exit velocity',     fmt(D.ve,0) + ' m/s'],
      ['enthalpy ceiling',  fmt(D.vMax,0) + ' m/s'],
      ['mass flow',         D.choked ? fmt(D.mdot*1000,1) + ' g/s' : 'not choked'],
      ['thrust',            fmt(D.thrust,1) + ' N'],
      ['thrust coeff C_F',  fmt(D.cf,3)],
      ['c*',                fmt(D.cstar,0) + ' m/s'],
      ['Isp (vac-corrected)', fmt(D.isp,0) + ' s' + (P.nozShape === 0 ? ` → ${fmt(D.isp*D.lambda,0)} s` : '')],
      ['optimum ε here',    fmt(D.epsOpt,2) + ' : 1'],
    ]) + '<hr>' +
    rows('Environment', [
      ['ambient pressure', fmtP(D.pa)],
      ['ambient density',  fmt(D.rhoAmb,4) + ' kg/m³'],
      ['sound speed',      fmt(D.aAmb,0) + ' m/s'],
      ['freestream',       fmt(P.vAmb,0) + ' m/s (M ' + fmt(D.machInf,2) + ')'],
    ]) + '<hr>' +
    rows(`Measured at ${P.probe > 0 ? fmt(P.probe,0) + ' mm past the exit' : 'the exit plane'}`, [
      ['on-axis u_z',   fmt(m.axis,0) + ' m/s'],
      ['peak u_z now',  fmt(m.mx,0) + ' m/s'],
      ['peak u_z ever', fmt(S.peak,0) + ' m/s' + (S.peak > 1 ? ` @ ${fmt(S.peakT,2)} ms` : '')],
      ['max Mach here', fmt(m.machMax,2)],
      ['max Mach field',fmt(CP.machMax,2)],
      ['propellant flow', fmt(m.mdot*1000,1) + ' g/s' +
                        (D.mdot > 0 ? ` (${fmt(100*m.mdot/D.mdot,0)}% of ideal)` : '')],
      ['all gas across',fmt(m.mdotAll*1000,1) + ' g/s'],
      ['momentum + Δp',  fmt(m.thrust,1) + ' N' +
                        (D.thrust > 0 ? ` (${fmt(100*m.thrust/D.thrust,0)}% of ideal)` : '')],
    ]) +
    rest.map(([c,t]) => `<div class="flag ${c}">${t}</div>`).join('');
  markActiveQuality();
}

/* One definition of the colour scale, shared by the shader, the on-screen legend and the
   legend burned into exported video, with an export override that freezes it. */
function colourScaleFor(vmax){
  const g = VIEW.gain, E = env();
  let base;
  switch (VIEW.field){
    case 1: base = Math.max(vmax * 0.85, 1e-3); break;
    case 2: base = Math.max(vmax / Math.min(S.dz, S.dr) * 0.12, 1e-3); break;
    case 3: base = Math.max(E.pa * 1.5, 500); break;
    case 4: base = Math.max(vmax * 0.85, 1e-3); break;
    case 5: base = Math.max(derived().Me * 1.15, 1.4); break;
    case 6: base = Math.max(E.rhoA * 0.35 / Math.min(S.dz, S.dr), 1e-6); break;
    case 7: base = Math.max(P.Tc * 1.05, 400); break;
    default: base = 1;
  }
  return base / g;
}
const activeColourScale = () => (EXPORTING && EXP.scale) ? EXP.scale : colourScaleFor(S.vmax);
</script>

<script>
"use strict";
/* ==========================================================================
   WebGPU device, the shared uniform block, and the max-reduction.

   There is one solver here and it is a compute solver, so WebGPU is required
   rather than preferred. The original Airzooka carried a WebGL2 fragment-shader
   fallback for its incompressible solver; a density-based scheme with an HLLC
   Riemann solver has no cheap fragment-shader form, and keeping a second solver
   that answers a different question was worse than requiring a modern browser.
   ========================================================================== */

const WG = { ok:false, dev:null, ctx:null, fmt:null, canvas:null };

function fatal(msg){
  const e = document.getElementById('err');
  e.style.display = 'block';
  e.textContent = msg;
  throw new Error(msg);
}

/* ---- the uniform block every kernel reads ----
   Laid out by hand so the JS packer and the WGSL struct cannot drift: vec2 pairs first
   (8-byte aligned), then vec4s on 16-byte boundaries. 176 bytes, padded to the 256-byte
   dynamic-offset alignment. */
const WGSL_PARAMS = `
struct Params {
  cells : vec2<i32>,          // Nz, Nr
  faces : vec2<i32>,          // Nz+1, Nr+1
  d     : vec2<f32>,          // dz, dr
  dtlz  : vec2<f32>,          // dt, Lz
  env   : vec4<f32>,          // Rmax, p_ambient, rho_ambient, v_freestream
  vehA  : vec4<f32>,          // zNose, zShoulder, zInjector, zConvStart
  vehB  : vec4<f32>,          // zThroat, zExit, bodyR, noseType
  vehC  : vec4<f32>,          // chamberR, throatR, exitR, nozzleShape
  vehD  : vec4<f32>,          // injectorDepth, p_chamber, rho_chamber, _
  flu   : vec4<f32>,          // visc, _, tracerFade, smagorinsky
  misc  : vec4<f32>,          // emptyDomain, probeIz, _, _
  gas   : vec4<f32>,          // gamma, R, Prandtl, rk stage weight
  gas2  : vec4<f32>,          // a_ref, spongeZ, spongeR, _
};
@group(0) @binding(0) var<uniform> P : Params;
`;

const PARAM_STRIDE = 256;                 // uniform dynamic-offset alignment
const PARAM_FLOATS = PARAM_STRIDE / 4;
const PARAM_BYTES  = 176;                 // the part of a slot the struct actually covers

const WGSL_REDUCE = `
struct RP { n : u32, first : u32, _a : u32, _b : u32 };
@group(0) @binding(0) var<uniform> R : RP;
@group(1) @binding(0) var<storage, read>       src : array<vec2<f32>>;
@group(1) @binding(1) var<storage, read_write> dst : array<vec2<f32>>;

var<workgroup> sh : array<vec2<f32>, 256>;

@compute @workgroup_size(256)
fn reduceMax(@builtin(global_invocation_id) g : vec3<u32>,
             @builtin(local_invocation_index) tid : u32,
             @builtin(workgroup_id) wid : vec3<u32>) {
  var v = vec2<f32>(0.0);
  if (g.x < R.n) {
    v = src[g.x];
    if (R.first == 1u) { v = abs(v); }
  }
  sh[tid] = v;
  workgroupBarrier();
  var s = 128u;
  loop {
    if (s == 0u) { break; }
    if (tid < s) { sh[tid] = max(sh[tid], sh[tid + s]); }
    workgroupBarrier();
    s = s >> 1u;
  }
  if (tid == 0u) { dst[wid.x] = sh[0]; }
}
`;

async function wgpuInit(){
  if (!navigator.gpu)
    fatal('Rocket Sim needs WebGPU, and this browser does not expose navigator.gpu.\n\n' +
          'Chrome 113+, Edge 113+, Safari 26+ and Firefox 141+ on Windows all have it. ' +
          'On Linux Firefox and on older Safari it may need to be enabled by hand.');
  let ad, dev;
  try {
    ad = await navigator.gpu.requestAdapter({ powerPreference:'high-performance' });
    if (!ad) fatal('WebGPU is present but no adapter was returned — no GPU this process may use.');
    const want = Math.min(10, ad.limits.maxStorageBuffersPerShaderStage || 8);
    dev = await ad.requestDevice({ requiredLimits:{ maxStorageBuffersPerShaderStage: want } });
  } catch (e){
    fatal('Could not get a WebGPU device: ' + (e && e.message || e));
  }
  WG.dev = dev;
  WG.canvas = document.getElementById('viewgpu');
  WG.ctx = WG.canvas.getContext('webgpu');
  if (!WG.ctx) fatal('The canvas would not give a webgpu context.');
  WG.fmt = navigator.gpu.getPreferredCanvasFormat();
  WG.ctx.configure({ device: dev, format: WG.fmt, alphaMode:'opaque' });

  dev.onuncapturederror = e => {
    console.error('WebGPU', e.error);
    if (!WG.failed){ WG.failed = true; wgpuFail(e.error && e.error.message || 'device error'); }
  };

  const modR = dev.createShaderModule({ code: WGSL_REDUCE });
  const info = await modR.getCompilationInfo();
  const bad = info.messages.filter(x => x.type === 'error');
  if (bad.length) fatal('reduction kernel: ' + bad[0].message);

  const uni = dyn => ({ binding:0, visibility:GPUShaderStage.COMPUTE | GPUShaderStage.FRAGMENT,
                        buffer:{ type:'uniform', hasDynamicOffset:!!dyn } });
  WG.bglP = dev.createBindGroupLayout({ entries:[uni(true)] });
  WG.bglS = dev.createBindGroupLayout({ entries:[
    { binding:0, visibility:GPUShaderStage.FRAGMENT, buffer:{ type:'uniform' } } ] });
  WG.bglRP = dev.createBindGroupLayout({ entries:[
    { binding:0, visibility:GPUShaderStage.COMPUTE, buffer:{ type:'uniform', hasDynamicOffset:true } } ] });
  WG.bglR = dev.createBindGroupLayout({ entries:[
    { binding:0, visibility:GPUShaderStage.COMPUTE, buffer:{ type:'read-only-storage' } },
    { binding:1, visibility:GPUShaderStage.COMPUTE, buffer:{ type:'storage' } } ] });

  WG.pipe = { reduceMax: dev.createComputePipeline({
    layout: dev.createPipelineLayout({ bindGroupLayouts:[WG.bglRP, WG.bglR] }),
    compute:{ module:modR, entryPoint:'reduceMax' } }) };

  // one big dynamic-offset uniform buffer: every step of a frame writes its own slot
  WG.buf = {};
  WG.buf.params = dev.createBuffer({ size: PARAM_STRIDE * 2048,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  WG.paramHost = new ArrayBuffer(PARAM_STRIDE * 2048);
  WG.paramF = new Float32Array(WG.paramHost);
  WG.paramI = new Int32Array(WG.paramHost);
  WG.bgP = dev.createBindGroup({ layout:WG.bglP, entries:[
    { binding:0, resource:{ buffer:WG.buf.params, size:PARAM_BYTES } }] });

  WG.buf.showU = dev.createBuffer({ size:32,
    usage:GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  WG.bgS = dev.createBindGroup({ layout:WG.bglS, entries:[
    { binding:0, resource:{ buffer:WG.buf.showU }}] });

  WG.ok = true;
  return true;
}

function wgpuFail(msg){
  const el = document.getElementById('diverged');
  if (el){ el.style.display = 'block';
           el.innerHTML = `<b>WebGPU error.</b> ${msg}`; }
}

/* ---- pack one stage's uniforms into slot `slot` ----
   `simT` is the simulated time this stage sits at, which is what the chamber ramp needs;
   the interactive loop plans a whole frame's worth of stages before submitting any of them,
   so it cannot read the ramp off S.t. */
const CTEST = { emptyDomain:false };
function packParams(slot, dt, weight, simT){
  const F = WG.paramF, I = WG.paramI, o = slot * PARAM_FLOATS;
  const E = env(), C = chamberState(simT);
  I[o+0] = S.Nz;      I[o+1] = S.Nr;
  I[o+2] = S.Nz + 1;  I[o+3] = S.Nr + 1;
  F[o+4] = S.dz;      F[o+5] = S.dr;
  F[o+6] = dt;        F[o+7] = S.Lz;

  F[o+8]  = S.Rmax;   F[o+9]  = E.pa;      F[o+10] = E.rhoA;    F[o+11] = E.vInf;
  F[o+12] = GEO.zNose;F[o+13] = GEO.zShoulder; F[o+14] = GEO.zInj; F[o+15] = GEO.zConv0;
  F[o+16] = GEO.zThroat; F[o+17] = GEO.zExit; F[o+18] = GEO.bodyR; F[o+19] = P.noseType;
  F[o+20] = P.chamR;  F[o+21] = GEO.throatR; F[o+22] = GEO.nozExitR; F[o+23] = P.nozShape;
  F[o+24] = Math.max(3 * S.dz, 2.0);       // injector plenum depth: >= the MUSCL stencil
  F[o+25] = C.p;      F[o+26] = C.rho;     F[o+27] = 0;

  F[o+28] = P.visc;   F[o+29] = 0;         F[o+30] = P.dyeDiss; F[o+31] = P.smag;
  F[o+32] = CTEST.emptyDomain ? 1 : 0;
  F[o+33] = probeIz().iz; F[o+34] = 0;     F[o+35] = 0;

  F[o+36] = P.gamma;  F[o+37] = P.Rgas;    F[o+38] = 0.72;      F[o+39] = weight;
  const aRef = Math.max(E.aA, Math.sqrt(P.gamma * P.Rgas * P.Tc));
  F[o+40] = aRef;     F[o+41] = 0.08 * S.Lz; F[o+42] = 0.12 * S.Rmax; F[o+43] = 0;
}
</script>

<script>
"use strict";
/* ==========================================================================
   Compressible solver — axisymmetric Navier–Stokes, density-based.

   Conserved state U = (rho, rho*u_z, rho*u_r, E) as cell averages on a finite
   volume grid. Fluxes from an HLLC approximate Riemann solver with MUSCL
   reconstruction and a minmod limiter, advanced by SSP-RK2. This carries real
   acoustics, so it chokes, forms shocks and cannot exceed the physical exit
   velocity that 1-D theory allows.

   Three things make it workable here:

   1. A low-Mach correction (Thornber et al. 2008) on the reconstructed
      velocities. Standard upwind flux has dissipation growing like 1/M, which
      would smear the low-speed external flow over the nose and body while the
      plume next door is at Mach 4.
   2. Reflecting-wall Riemann fluxes rather than ghost cells, which stays robust
      across the sharp throat and the nozzle lip.
   3. The injector is a plenum: a band of cells at the head of the chamber held
      at stagnation conditions and otherwise treated as ordinary fluid by the
      flux kernels. That is the standard reservoir boundary, and it reproduces
      choked mass flow without anyone having to prescribe it.

   Geometry, forward to aft:  nose cone, forebody, chamber, converging section,
   throat, diverging section, exit plane. Ambient air enters at z = 0 at the
   flight speed and washes over the outside.
   ========================================================================== */

/* ---- geometry and thermodynamics, shared by the kernels and the display shader ---- */
const WGSL_GEOM = WGSL_PARAMS + `
const FLUID  : i32 = 0;
const WALL   : i32 = 1;
const PLENUM : i32 = 2;
const PI : f32 = 3.14159265359;

fn GAM() -> f32 { return P.gas.x; }
fn RGAS() -> f32 { return P.gas.y; }
/* Positivity floors relative to the ambient state rather than absolute: an absolute 1 Pa
   floor is invisible at sea level and silently clamps the flow at 65 km. */
fn RHO_FLOOR() -> f32 { return 1.0e-7 * P.env.z; }
fn P_FLOOR() -> f32 { return 1.0e-7 * P.env.y; }

/* Outer surface of the vehicle at z. Negative means this station is off the vehicle. */
fn outerR(z : f32) -> f32 {
  let zN = P.vehA.x; let zS = P.vehA.y; let bR = P.vehB.z;
  if (z < zN || z > P.vehB.y) { return -1.0; }
  if (z >= zS) { return bR; }
  let s = clamp((z - zN) / max(zS - zN, 1e-6), 0.0, 1.0);
  if (P.vehB.w < 1.5) { return bR * s; }                        // conical
  return bR * sqrt(max(s * (2.0 - s), 0.0));                    // ellipsoidal
}

/* Internal cavity radius at z: chamber, raised-cosine contraction, then the divergent
   contour. Negative means solid at every radius at this station. */
fn innerR(z : f32) -> f32 {
  let zI = P.vehA.z; let zC = P.vehA.w; let zT = P.vehB.x; let zE = P.vehB.y;
  if (z < zI || z > zE) { return -1.0; }
  let rc = P.vehC.x; let rt = P.vehC.y; let re = P.vehC.z;
  if (z <= zC) { return rc; }
  if (z <= zT) {
    let s = clamp((z - zC) / max(zT - zC, 1e-6), 0.0, 1.0);
    return rt + (rc - rt) * 0.5 * (1.0 + cos(PI * s));
  }
  let s = clamp((z - zT) / max(zE - zT, 1e-6), 0.0, 1.0);
  if (P.vehC.w < 0.5) { return rt + (re - rt) * s; }             // conical
  return rt + (re - rt) * (2.0 * s - s * s);                     // bell, parabolic
}

fn solidAt(p : vec2<f32>) -> i32 {
  if (P.misc.x > 0.5) { return FLUID; }                          // validation: empty domain
  let ro = outerR(p.x);
  if (ro < 0.0 || p.y >= ro) { return FLUID; }
  let ri = innerR(p.x);
  if (ri >= 0.0 && p.y < ri) {
    if (p.x <= P.vehA.z + P.vehD.x) { return PLENUM; }
    return FLUID;
  }
  return WALL;
}
fn solidCell(iz : i32, ir : i32) -> i32 {
  return solidAt(vec2<f32>((f32(iz) + 0.5) * P.d.x, (f32(ir) + 0.5) * P.d.y));
}
fn blocked(iz : i32, ir : i32) -> bool { return solidCell(iz, ir) == WALL; }

fn toPrim(u : vec4<f32>) -> vec4<f32> {          // -> (rho, uz, ur, p)
  let rho = max(u.x, RHO_FLOOR());
  let uz = u.y / rho; let ur = u.z / rho;
  let p = max((GAM() - 1.0) * (u.w - 0.5 * rho * (uz * uz + ur * ur)), P_FLOOR());
  return vec4<f32>(rho, uz, ur, p);
}
fn toCons(w : vec4<f32>) -> vec4<f32> {
  return vec4<f32>(w.x, w.x * w.y, w.x * w.z,
                   w.w / (GAM() - 1.0) + 0.5 * w.x * (w.y * w.y + w.z * w.z));
}
/* Freestream, in each face's own frame: normal component second, tangential third. */
fn ambZ() -> vec4<f32> { return vec4<f32>(P.env.z, P.env.w, 0.0, P.env.y); }
fn ambR() -> vec4<f32> { return vec4<f32>(P.env.z, 0.0, P.env.w, P.env.y); }
fn ambCons() -> vec4<f32> { return toCons(ambZ()); }
`;

const WGSL_COMP = WGSL_GEOM + `
@group(1) @binding(0) var<storage, read>       Ua : array<vec4<f32>>;   // U^n
@group(1) @binding(1) var<storage, read_write> Ub : array<vec4<f32>>;   // stage target
@group(1) @binding(2) var<storage, read>       Da : array<f32>;         // rho*Y, exhaust tracer
@group(1) @binding(3) var<storage, read_write> Db : array<f32>;
@group(1) @binding(4) var<storage, read_write> Fz : array<vec4<f32>>;
@group(1) @binding(5) var<storage, read_write> Fr : array<vec4<f32>>;
@group(1) @binding(6) var<storage, read_write> wav : array<vec2<f32>>;
@group(1) @binding(7) var<storage, read_write> probeB : array<f32>;
@group(1) @binding(8) var<storage, read>       Uold : array<vec4<f32>>; // U^n for RK stage 2
@group(1) @binding(9) var<storage, read>       Dold : array<f32>;

fn cIdx(iz : i32, ir : i32) -> u32 {
  let z = clamp(iz, 0, P.cells.x - 1);
  let r = clamp(ir, 0, P.cells.y - 1);
  return u32(r * P.cells.x + z);
}
fn Uat(iz : i32, ir : i32) -> vec4<f32> { return Ua[cIdx(iz, ir)]; }
fn Wat(iz : i32, ir : i32) -> vec4<f32> { return toPrim(Uat(iz, ir)); }

fn minmod(a : f32, b : f32) -> f32 {
  if (a * b <= 0.0) { return 0.0; }
  if (abs(a) < abs(b)) { return a; }
  return b;
}
fn mm4(a : vec4<f32>, b : vec4<f32>) -> vec4<f32> {
  return vec4<f32>(minmod(a.x, b.x), minmod(a.y, b.y), minmod(a.z, b.z), minmod(a.w, b.w));
}

/* HLLC, in a frame where .y is the wall-normal velocity and .z the tangential one. */
fn hllc(wL : vec4<f32>, wR : vec4<f32>) -> vec4<f32> {
  let g = GAM();
  let rL = wL.x; let unL = wL.y; let utL = wL.z; let pL = wL.w;
  let rR = wR.x; let unR = wR.y; let utR = wR.z; let pR = wR.w;
  let aL = sqrt(g * pL / rL); let aR = sqrt(g * pR / rR);
  let EL = pL / (g - 1.0) + 0.5 * rL * (unL * unL + utL * utL);
  let ER = pR / (g - 1.0) + 0.5 * rR * (unR * unR + utR * utR);
  let SL = min(unL - aL, unR - aR);
  let SR = max(unL + aL, unR + aR);
  if (SL >= 0.0) {
    return vec4<f32>(rL * unL, rL * unL * unL + pL, rL * unL * utL, (EL + pL) * unL);
  }
  if (SR <= 0.0) {
    return vec4<f32>(rR * unR, rR * unR * unR + pR, rR * unR * utR, (ER + pR) * unR);
  }
  let den = rL * (SL - unL) - rR * (SR - unR);
  var Ss = 0.0;
  if (abs(den) > 1e-12) {
    Ss = (pR - pL + rL * unL * (SL - unL) - rR * unR * (SR - unR)) / den;
  }
  if (Ss >= 0.0) {
    let FL = vec4<f32>(rL * unL, rL * unL * unL + pL, rL * unL * utL, (EL + pL) * unL);
    let f = rL * (SL - unL) / (SL - Ss);
    let Us = vec4<f32>(f, f * Ss, f * utL,
              f * (EL / rL + (Ss - unL) * (Ss + pL / (rL * (SL - unL)))));
    return FL + SL * (Us - vec4<f32>(rL, rL * unL, rL * utL, EL));
  }
  let FR = vec4<f32>(rR * unR, rR * unR * unR + pR, rR * unR * utR, (ER + pR) * unR);
  let f = rR * (SR - unR) / (SR - Ss);
  let Us = vec4<f32>(f, f * Ss, f * utR,
            f * (ER / rR + (Ss - unR) * (Ss + pR / (rR * (SR - unR)))));
  return FR + SR * (Us - vec4<f32>(rR, rR * unR, rR * utR, ER));
}

/* Thornber's low-Mach reconstruction fix. Plain upwinding has dissipation that grows like
   1/M; the external flow over the body runs two orders of magnitude slower than the plume
   and would otherwise be dissipated away. */
fn lowMach(wL : ptr<function, vec4<f32>>, wR : ptr<function, vec4<f32>>) {
  let g = GAM();
  let aL = sqrt(g * (*wL).w / (*wL).x);
  let aR = sqrt(g * (*wR).w / (*wR).x);
  let ML = length(vec2<f32>((*wL).y, (*wL).z)) / aL;
  let MR = length(vec2<f32>((*wR).y, (*wR).z)) / aR;
  let zf = min(1.0, max(ML, MR));
  let un = 0.5 * ((*wL).y + (*wR).y); let dn = 0.5 * ((*wL).y - (*wR).y) * zf;
  let ut = 0.5 * ((*wL).z + (*wR).z); let dt2 = 0.5 * ((*wL).z - (*wR).z) * zf;
  (*wL).y = un + dn; (*wR).y = un - dn;
  (*wL).z = ut + dt2; (*wR).z = ut - dt2;
}

/* A wall is handled by reflecting the fluid state through it and letting the Riemann solver
   produce the flux. Every surface here is static, so the reflection is about zero. */
fn reflectN(w : vec4<f32>) -> vec4<f32> {
  return vec4<f32>(w.x, -w.y, w.z, w.w);
}

/* ---- axial faces: iz in [0, Nz], ir in [0, Nr) ---- */
@compute @workgroup_size(64, 1)
fn fluxZ(@builtin(global_invocation_id) g : vec3<u32>) {
  let iz = i32(g.x); let ir = i32(g.y);
  if (iz > P.cells.x || ir >= P.cells.y) { return; }
  let fi = u32(ir * (P.cells.x + 1) + iz);

  var bL = blocked(max(iz - 1, 0), ir);
  var bR = blocked(min(iz, P.cells.x - 1), ir);
  if (bL && bR) { Fz[fi] = vec4<f32>(0.0); return; }

  var wL : vec4<f32>; var wR : vec4<f32>;
  if (bL) {                                            // wall on the left
    wR = Wat(iz, ir);
    wL = reflectN(wR);
  } else if (bR) {                                     // wall on the right
    wL = Wat(iz - 1, ir);
    wR = reflectN(wL);
  } else if (iz == 0) {                                // inlet: the freestream, imposed
    wR = Wat(0, ir);
    wL = ambZ();
  } else if (iz == P.cells.x) {                        // outlet: zero gradient
    wL = Wat(P.cells.x - 1, ir);
    wR = wL;
  } else {
    let wm1 = Wat(iz - 1, ir); let w0 = Wat(iz, ir);
    var wm2 = Wat(iz - 2, ir); var wp1 = Wat(iz + 1, ir);
    if (iz - 2 < 0 || blocked(iz - 2, ir)) { wm2 = wm1; }
    if (iz + 1 >= P.cells.x || blocked(iz + 1, ir)) { wp1 = w0; }
    wL = wm1 + 0.5 * mm4(wm1 - wm2, w0 - wm1);
    wR = w0  - 0.5 * mm4(w0 - wm1, wp1 - w0);
    lowMach(&wL, &wR);
  }
  wL.x = max(wL.x, RHO_FLOOR()); wR.x = max(wR.x, RHO_FLOOR());
  wL.w = max(wL.w, P_FLOOR());   wR.w = max(wR.w, P_FLOOR());
  Fz[fi] = hllc(wL, wR);
}

/* ---- radial faces: iz in [0, Nz), ir in [0, Nr] ---- */
@compute @workgroup_size(64, 1)
fn fluxR(@builtin(global_invocation_id) g : vec3<u32>) {
  let iz = i32(g.x); let ir = i32(g.y);
  if (iz >= P.cells.x || ir > P.cells.y) { return; }
  let fi = u32(ir * P.cells.x + iz);
  if (ir == 0) { Fr[fi] = vec4<f32>(0.0); return; }     // axis: face area is zero

  let bL = blocked(iz, max(ir - 1, 0));
  let bR = blocked(iz, min(ir, P.cells.y - 1));
  if (bL && bR) { Fr[fi] = vec4<f32>(0.0); return; }

  var wL : vec4<f32>; var wR : vec4<f32>;
  if (bL) {
    wR = Wat(iz, ir).xzyw;                             // (rho, ur, uz, p): normal first
    wL = reflectN(wR);
  } else if (bR) {
    wL = Wat(iz, ir - 1).xzyw;
    wR = reflectN(wL);
  } else if (ir == P.cells.y) {                        // far field: zero radial gradient
    let w = Wat(iz, P.cells.y - 1).xzyw;
    wL = w; wR = w;
  } else {
    let wm1 = Wat(iz, ir - 1).xzyw; let w0 = Wat(iz, ir).xzyw;
    var wm2 = Wat(iz, ir - 2).xzyw; var wp1 = Wat(iz, ir + 1).xzyw;
    if (ir - 2 < 0 || blocked(iz, ir - 2)) { wm2 = wm1; }
    if (ir + 1 >= P.cells.y || blocked(iz, ir + 1)) { wp1 = w0; }
    wL = wm1 + 0.5 * mm4(wm1 - wm2, w0 - wm1);
    wR = w0  - 0.5 * mm4(w0 - wm1, wp1 - w0);
    lowMach(&wL, &wR);
  }
  wL.x = max(wL.x, RHO_FLOOR()); wR.x = max(wR.x, RHO_FLOOR());
  wL.w = max(wL.w, P_FLOOR());   wR.w = max(wR.w, P_FLOOR());
  Fr[fi] = hllc(wL, wR).xzyw;                          // back to (rho, rho*uz, rho*ur, E)
}

/* ---- viscous stress and conduction, central differences at cell centres ---- */
fn muEff(iz : i32, ir : i32, rho : f32) -> f32 {
  var nu = P.flu.x;
  if (P.flu.w > 0.0) {                                  // Smagorinsky sub-grid
    let dz = P.d.x; let dr = P.d.y;
    let rc = (f32(ir) + 0.5) * dr;
    let wp = Wat(iz + 1, ir); let wm = Wat(iz - 1, ir);
    let wn = Wat(iz, ir + 1); let ws = Wat(iz, ir - 1);
    let w0 = Wat(iz, ir);
    let duzdz = (wp.y - wm.y) / (2.0 * dz);
    let durdr = (wn.z - ws.z) / (2.0 * dr);
    let duzdr = (wn.y - ws.y) / (2.0 * dr);
    let durdz = (wp.z - wm.z) / (2.0 * dz);
    let stt = w0.z / max(rc, 1e-6);
    let srz = 0.5 * (duzdr + durdz);
    let s2 = 2.0 * (duzdz * duzdz + durdr * durdr + stt * stt) + 4.0 * srz * srz;
    let dd = sqrt(dz * dr);
    nu = nu + P.flu.w * P.flu.w * dd * dd * sqrt(max(s2, 0.0));
  }
  return rho * nu;
}

@compute @workgroup_size(8, 8)
fn update(@builtin(global_invocation_id) g : vec3<u32>) {
  let iz = i32(g.x); let ir = i32(g.y);
  if (iz >= P.cells.x || ir >= P.cells.y) { return; }
  let k = u32(ir * P.cells.x + iz);
  let dz = P.d.x; let dr = P.d.y; let dt = P.dtlz.x;
  let rc = (f32(ir) + 0.5) * dr;
  let s = solidCell(iz, ir);

  /* The injector plenum: pinned to stagnation conditions and full of exhaust. The flux
     kernels treat it as ordinary fluid, so the nozzle sees a reservoir and chokes on its
     own rather than being told what mass flow to pass. */
  if (s == PLENUM) {
    Ub[k] = toCons(vec4<f32>(P.vehD.z, 0.0, 0.0, P.vehD.y));
    Db[k] = P.vehD.z;
    return;
  }
  if (s == WALL) {
    // Keep wall cells holding a plausible state: MUSCL reconstruction near a corner can
    // still reach one, and stale garbage there shows up as a spike at the lip.
    var acc = vec2<f32>(0.0); var n = 0.0;
    for (var q = 0; q < 4; q++) {
      var jz = iz; var jr = ir;
      if (q == 0) { jz = iz - 1; } else if (q == 1) { jz = iz + 1; }
      else if (q == 2) { jr = ir - 1; } else { jr = ir + 1; }
      if (jz >= 0 && jz < P.cells.x && jr >= 0 && jr < P.cells.y && !blocked(jz, jr)) {
        let w = Wat(jz, jr); acc = acc + vec2<f32>(w.x, w.w); n = n + 1.0;
      }
    }
    var rho = P.env.z; var pr = P.env.y;
    if (n > 0.0) { rho = acc.x / n; pr = acc.y / n; }
    Ub[k] = toCons(vec4<f32>(rho, 0.0, 0.0, pr));
    Db[k] = 0.0;
    return;
  }

  let fzL = Fz[u32(ir * (P.cells.x + 1) + iz)];
  let fzR = Fz[u32(ir * (P.cells.x + 1) + iz + 1)];
  let frL = Fr[u32(ir * P.cells.x + iz)];
  let frR = Fr[u32((ir + 1) * P.cells.x + iz)];
  let rL = f32(ir) * dr; let rR = f32(ir + 1) * dr;

  let w0 = Wat(iz, ir);
  var L = -(fzR - fzL) / dz - (rR * frR - rL * frL) / (rc * dr);
  L.z = L.z + w0.w / rc;                                // axisymmetric pressure source

  // ---- viscous terms ----
  if (P.flu.x > 0.0 || P.flu.w > 0.0) {
    let mu = muEff(iz, ir, w0.x);
    let wp = Wat(iz + 1, ir); let wm = Wat(iz - 1, ir);
    let wn = Wat(iz, ir + 1); let ws = Wat(iz, ir - 1);
    let dz2 = dz * dz; let dr2 = dr * dr;
    let lapz = (wp.y - 2.0 * w0.y + wm.y) / dz2
             + ((rR * (wn.y - w0.y) - rL * (w0.y - ws.y)) / (rc * dr2));
    let lapr = (wp.z - 2.0 * w0.z + wm.z) / dz2
             + ((rR * (wn.z - w0.z) - rL * (w0.z - ws.z)) / (rc * dr2))
             - w0.z / (rc * rc);
    L.y = L.y + mu * lapz;
    L.z = L.z + mu * lapr;
    // viscous heating plus conduction (Pr constant, cp = gamma R / (gamma - 1))
    let duzdz = (wp.y - wm.y) / (2.0 * dz);
    let durdr = (wn.z - ws.z) / (2.0 * dr);
    let duzdr = (wn.y - ws.y) / (2.0 * dr);
    let durdz = (wp.z - wm.z) / (2.0 * dz);
    let divu = duzdz + durdr + w0.z / rc;
    let phi = mu * (2.0 * (duzdz * duzdz + durdr * durdr + (w0.z / rc) * (w0.z / rc))
                    + (duzdr + durdz) * (duzdr + durdz) - (2.0 / 3.0) * divu * divu);
    let Rg = RGAS();
    let cp = GAM() * Rg / (GAM() - 1.0);
    let kt = mu * cp / P.gas.z;
    let T0c = w0.w / (w0.x * Rg);
    let Tp = wp.w / (wp.x * Rg); let Tm = wm.w / (wm.x * Rg);
    let Tn = wn.w / (wn.x * Rg); let Ts = ws.w / (ws.x * Rg);
    let lapT = (Tp - 2.0 * T0c + Tm) / dz2
             + ((rR * (Tn - T0c) - rL * (T0c - Ts)) / (rc * dr2));
    L.w = L.w + phi + kt * lapT + mu * (w0.y * lapz + w0.z * lapr);
  }

  let wgt = P.gas.w;
  var Un = (1.0 - wgt) * (Ua[k] + dt * L) + wgt * Uold[k];

  // ---- exhaust tracer, carried by the mass flux with an upwind mass fraction ----
  let Yl = Da[cIdx(iz - 1, ir)] / max(Wat(iz - 1, ir).x, RHO_FLOOR());
  let Y0 = Da[k] / max(w0.x, RHO_FLOOR());
  let Yr = Da[cIdx(iz + 1, ir)] / max(Wat(iz + 1, ir).x, RHO_FLOOR());
  let Yd = Da[cIdx(iz, ir - 1)] / max(Wat(iz, ir - 1).x, RHO_FLOOR());
  let Yu = Da[cIdx(iz, ir + 1)] / max(Wat(iz, ir + 1).x, RHO_FLOOR());
  var yzL = Y0; if (fzL.x >= 0.0) { yzL = Yl; }
  var yzR = Y0; if (fzR.x <  0.0) { yzR = Yr; }
  var yrL = Y0; if (frL.x >= 0.0) { yrL = Yd; }
  var yrR = Y0; if (frR.x <  0.0) { yrR = Yu; }
  let Ld = -(fzR.x * yzR - fzL.x * yzL) / dz
           - (rR * frR.x * yrR - rL * frL.x * yrL) / (rc * dr);
  var Dn = (1.0 - wgt) * (Da[k] + dt * Ld) + wgt * Dold[k];
  Dn = Dn * exp(-P.flu.z * dt);

  // ---- sponge: absorb outgoing acoustics so the open boundaries do not ring, and hold
  //      the far field at the freestream rather than at rest ----
  let sz = P.gas2.y; let sr = P.gas2.z;
  let zc = (f32(iz) + 0.5) * dz;
  var sig = 0.0;
  if (zc < sz)                { sig = max(sig, 1.0 - zc / sz); }
  if (zc > P.dtlz.y - sz)     { sig = max(sig, 1.0 - (P.dtlz.y - zc) / sz); }
  if (rc > P.env.x - sr)      { sig = max(sig, 1.0 - (P.env.x - rc) / sr); }
  if (sig > 0.0) {
    let a = clamp(sig * sig * dt * P.gas2.x / max(sz, 1e-6), 0.0, 1.0);
    Un = mix(Un, ambCons(), a);
    Dn = mix(Dn, 0.0, a);
  }

  Un.x = max(Un.x, RHO_FLOOR());
  Ub[k] = Un;
  Db[k] = clamp(Dn, 0.0, Un.x);
}

@compute @workgroup_size(8, 8)
fn waveSpeed(@builtin(global_invocation_id) g : vec3<u32>) {
  let iz = i32(g.x); let ir = i32(g.y);
  if (iz >= P.cells.x || ir >= P.cells.y) { return; }
  let k = u32(ir * P.cells.x + iz);
  if (blocked(iz, ir)) { wav[k] = vec2<f32>(0.0); return; }
  let w = toPrim(Ua[k]);
  let a = sqrt(GAM() * w.w / w.x);
  let sp = (abs(w.y) + a) / P.d.x + (abs(w.z) + a) / P.d.y;
  let mach = length(vec2<f32>(w.y, w.z)) / a;
  wav[k] = vec2<f32>(sp, mach);
}

/* Everything starts at the freestream, chamber included: the plenum ramp fills it, and the
   chamber filling is itself part of the ignition transient. */
@compute @workgroup_size(8, 8)
fn initState(@builtin(global_invocation_id) g : vec3<u32>) {
  let iz = i32(g.x); let ir = i32(g.y);
  if (iz >= P.cells.x || ir >= P.cells.y) { return; }
  let k = u32(ir * P.cells.x + iz);
  Ub[k] = ambCons();
  Db[k] = 0.0;
}

/* One radial column at the measurement plane: (u_z, rho, p, Mach) per cell. */
@compute @workgroup_size(64)
fn probeGather(@builtin(global_invocation_id) g : vec3<u32>) {
  let ir = i32(g.x);
  if (ir >= P.cells.y) { return; }
  let iz = clamp(i32(P.misc.y), 0, P.cells.x - 1);
  var w = vec4<f32>(P.env.z, 0.0, 0.0, P.env.y);
  if (!blocked(iz, ir)) { w = toPrim(Ua[u32(ir * P.cells.x + iz)]); }
  var Y = 0.0;
  if (!blocked(iz, ir)) { Y = clamp(Da[u32(ir * P.cells.x + iz)] / w.x, 0.0, 1.0); }
  let a = sqrt(GAM() * w.w / w.x);
  let b = u32(ir) * 8u;
  probeB[b + 0u] = w.y;
  probeB[b + 1u] = w.x;
  probeB[b + 2u] = w.w;
  probeB[b + 3u] = length(vec2<f32>(w.y, w.z)) / a;
  probeB[b + 4u] = Y;
}
`;

const WGSL_COMP_SHOW = WGSL_GEOM + `
@group(1) @binding(0) var<storage, read> Ua : array<vec4<f32>>;
@group(1) @binding(1) var<storage, read> Da : array<f32>;
struct Show { viewport : vec2<f32>, field : f32, scale : f32,
              showGeom : f32, probeZ : f32, _p : vec2<f32> };
@group(2) @binding(0) var<uniform> SH : Show;

fn cIdx(iz : i32, ir : i32) -> u32 {
  return u32(clamp(ir, 0, P.cells.y - 1) * P.cells.x + clamp(iz, 0, P.cells.x - 1));
}
fn prim(iz : i32, ir : i32) -> vec4<f32> { return toPrim(Ua[cIdx(iz, ir)]); }

@vertex fn vs(@builtin(vertex_index) vi : u32) -> @builtin(position) vec4<f32> {
  let v = vec2<f32>(f32((vi << 1u) & 2u), f32(vi & 2u));
  return vec4<f32>(v * 2.0 - 1.0, 0.0, 1.0);
}
fn viridis(t0 : f32) -> vec3<f32> {
  let t = clamp(t0, 0.0, 1.0);
  let c0=vec3<f32>(0.2777,0.0054,0.3341); let c1=vec3<f32>(0.1051,1.4046,1.3846);
  let c2=vec3<f32>(-0.3309,0.2148,0.0951); let c3=vec3<f32>(-4.6342,-5.7991,-19.3324);
  let c4=vec3<f32>(6.2283,14.1799,56.6906); let c5=vec3<f32>(4.7764,-13.7451,-65.3530);
  let c6=vec3<f32>(-5.4355,4.6459,26.3124);
  return clamp(c0+t*(c1+t*(c2+t*(c3+t*(c4+t*(c5+t*c6))))), vec3<f32>(0.0), vec3<f32>(1.0));
}
fn diverging(t : f32) -> vec3<f32> {
  let a = clamp(abs(t), 0.0, 1.0);
  var c = vec3<f32>(1.0, 0.42, 0.25);
  if (t < 0.0) { c = vec3<f32>(0.25, 0.55, 1.0); }
  return mix(vec3<f32>(0.055, 0.07, 0.09), c, pow(a, 0.75));
}
@fragment fn fs(@builtin(position) fc : vec4<f32>) -> @location(0) vec4<f32> {
  let uv = vec2<f32>(fc.x / SH.viewport.x, 1.0 - fc.y / SH.viewport.y);
  let z = uv.x * P.dtlz.y;
  let r = abs((uv.y - 0.5) * 2.0 * P.env.x);
  let p2 = vec2<f32>(z, r);
  let iz = clamp(i32(floor(z / P.d.x)), 0, P.cells.x - 1);
  let ir = clamp(i32(floor(r / P.d.y)), 0, P.cells.y - 1);
  var col = vec3<f32>(0.055, 0.07, 0.09);
  let sld = solidAt(p2);
  let fld = i32(SH.field);
  if (sld != WALL) {
    let w = prim(iz, ir);
    let a = sqrt(GAM() * w.w / w.x);
    let dye = clamp(Da[cIdx(iz, ir)] / w.x, 0.0, 1.0);
    if (fld == 0) {
      col = mix(col, vec3<f32>(1.0, 0.87, 0.62), pow(dye, 0.7));
    } else if (fld == 1) {
      col = viridis(length(vec2<f32>(w.y, w.z)) / max(SH.scale, 1e-6));
    } else if (fld == 2) {
      let wp = prim(iz + 1, ir); let wm = prim(iz - 1, ir);
      let wn = prim(iz, ir + 1); let ws = prim(iz, ir - 1);
      let vort = (wp.z - wm.z) / (2.0 * P.d.x) - (wn.y - ws.y) / (2.0 * P.d.y);
      var sgn = 1.0; if ((uv.y - 0.5) < 0.0) { sgn = -1.0; }
      col = diverging(clamp(sgn * vort / max(SH.scale, 1e-6), -1.0, 1.0));
    } else if (fld == 3) {
      col = diverging(clamp((w.w - P.env.y) / max(SH.scale, 1e-6), -1.0, 1.0));
    } else if (fld == 4) {
      col = diverging(clamp(w.y / max(SH.scale, 1e-6), -1.0, 1.0));
    } else if (fld == 5) {
      // Mach, with a hard white line at M = 1 so the sonic surface is visible
      let M = length(vec2<f32>(w.y, w.z)) / a;
      col = viridis(M / max(SH.scale, 1e-6));
      if (abs(M - 1.0) < 0.015 * max(SH.scale, 1.0)) { col = vec3<f32>(1.0, 1.0, 1.0); }
    } else if (fld == 7) {
      col = viridis(w.w / (w.x * RGAS()) / max(SH.scale, 1e-6));
    } else {
      // numerical schlieren: 1 - exp(-k |grad rho|) is how shocks are shown in practice
      let gz = (prim(iz + 1, ir).x - prim(iz - 1, ir).x) / (2.0 * P.d.x);
      let gr = (prim(iz, ir + 1).x - prim(iz, ir - 1).x) / (2.0 * P.d.y);
      let sc = length(vec2<f32>(gz, gr)) / max(SH.scale, 1e-9);
      let v = 1.0 - exp(-3.0 * sc);
      col = vec3<f32>(v, v, v);
    }
    if (sld == PLENUM && SH.showGeom > 0.5) { col = mix(col, vec3<f32>(0.95, 0.35, 0.15), 0.45); }
  } else if (SH.showGeom > 0.5) {
    col = vec3<f32>(0.30, 0.35, 0.42);
    if (fract((z * 0.5 + r * 0.5) / 3.0) < 0.5) { col = col + 0.04; }
  } else { col = vec3<f32>(0.10, 0.11, 0.13); }
  if (abs(uv.y - 0.5) * SH.viewport.y < 0.6) { col = mix(col, vec3<f32>(0.45,0.55,0.65), 0.5); }
  if (abs(z - SH.probeZ) < P.d.x * 0.6) { col = mix(col, vec3<f32>(1.0,0.85,0.35), 0.45); }
  // export reads the texture as raw bytes; emitting BGR here saves swizzling every pixel in JS
  if (SH._p.x > 0.5) { col = col.bgr; }
  return vec4<f32>(col, 1.0);
}
`;

/* ========================== driver ========================== */
const CP = { ok:false, idx:0, machMax:0, waveMax:1, gen:0 };

async function compInit(){
  const dev = WG.dev;
  const modK = dev.createShaderModule({ code: WGSL_COMP });
  const modS = dev.createShaderModule({ code: WGSL_COMP_SHOW });
  for (const m of [modK, modS]){
    const info = await m.getCompilationInfo();
    const bad = info.messages.filter(x => x.type === 'error');
    if (bad.length){
      console.error('solver shader:', bad);
      fatal('Solver kernels failed to compile:\n' + bad.map(b => b.message).join('\n'));
    }
  }
  const st = (b, ro) => ({ binding:b, visibility:GPUShaderStage.COMPUTE,
                           buffer:{ type: ro ? 'read-only-storage' : 'storage' } });
  CP.bglF = dev.createBindGroupLayout({ entries:[
    st(0,true), st(1,false), st(2,true), st(3,false), st(4,false),
    st(5,false), st(6,false), st(7,false), st(8,true), st(9,true) ] });
  const sr = b => ({ binding:b, visibility:GPUShaderStage.FRAGMENT,
                     buffer:{ type:'read-only-storage' } });
  CP.bglS = dev.createBindGroupLayout({ entries:[ sr(0), sr(1) ] });

  const plK = dev.createPipelineLayout({ bindGroupLayouts:[WG.bglP, CP.bglF] });
  const plS = dev.createPipelineLayout({ bindGroupLayouts:[WG.bglP, CP.bglS, WG.bglS] });
  CP.pipe = {};
  for (const n of ['fluxZ','fluxR','update','waveSpeed','initState','probeGather'])
    CP.pipe[n] = dev.createComputePipeline({ layout:plK, compute:{ module:modK, entryPoint:n } });
  CP.pipe.show = dev.createRenderPipeline({ layout:plS,
    vertex:{ module:modS, entryPoint:'vs' },
    fragment:{ module:modS, entryPoint:'fs', targets:[{ format:WG.fmt }] },
    primitive:{ topology:'triangle-list' } });
  CP.ok = true;
  return true;
}

function compAlloc(){
  const dev = WG.dev;
  for (const k in (CP.buf || {})) if (CP.buf[k] && CP.buf[k].destroy) CP.buf[k].destroy();
  CP.buf = {};
  const nC = S.Nz * S.Nr;
  const SU = GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST;
  const mk = (n, b) => dev.createBuffer({ size: Math.max(16, n * b), usage: SU });
  const B = CP.buf;
  B.U = [mk(nC,16), mk(nC,16), mk(nC,16)];
  B.D = [mk(nC,4),  mk(nC,4),  mk(nC,4)];
  B.Fz = mk((S.Nz + 1) * S.Nr, 16);
  B.Fr = mk(S.Nz * (S.Nr + 1), 16);
  B.wav = mk(nC, 8);
  B.probe = mk(S.Nr * 8, 4);

  CP.bg = [];
  for (let i = 0; i < 3; i++){
    const a = i, b = (i + 1) % 3, c = (i + 2) % 3;
    const mkbg = (src, dst) => dev.createBindGroup({ layout:CP.bglF, entries:[
      { binding:0, resource:{ buffer:B.U[src] } }, { binding:1, resource:{ buffer:B.U[dst] } },
      { binding:2, resource:{ buffer:B.D[src] } }, { binding:3, resource:{ buffer:B.D[dst] } },
      { binding:4, resource:{ buffer:B.Fz } },     { binding:5, resource:{ buffer:B.Fr } },
      { binding:6, resource:{ buffer:B.wav } },    { binding:7, resource:{ buffer:B.probe } },
      { binding:8, resource:{ buffer:B.U[a] } },   { binding:9, resource:{ buffer:B.D[a] } } ]});
    CP.bg.push([mkbg(a, b), mkbg(b, c)]);
  }
  CP.bgS = [0,1,2].map(i => dev.createBindGroup({ layout:CP.bglS, entries:[
    { binding:0, resource:{ buffer:B.U[i] } }, { binding:1, resource:{ buffer:B.D[i] } } ]}));

  // max-reduction chain over cells
  CP.red = [];
  let n = nC;
  while (n > 1){
    const outN = Math.ceil(n / 256);
    CP.red.push({ n, out: mk(outN, 8) });
    n = outN;
  }
  const rp = new Uint32Array(PARAM_STRIDE * Math.max(1, CP.red.length) / 4);
  CP.red.forEach((L, i) => { rp[i * PARAM_FLOATS] = L.n; rp[i * PARAM_FLOATS + 1] = 0; });
  B.redParams = dev.createBuffer({ size: PARAM_STRIDE * Math.max(1, CP.red.length),
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  dev.queue.writeBuffer(B.redParams, 0, rp);
  CP.bgRP = dev.createBindGroup({ layout:WG.bglRP, entries:[
    { binding:0, resource:{ buffer:B.redParams, size:16 } }] });
  CP.bgRed = CP.red.map((L, i) => dev.createBindGroup({ layout:WG.bglR, entries:[
    { binding:0, resource:{ buffer: i === 0 ? B.wav : CP.red[i-1].out } },
    { binding:1, resource:{ buffer:L.out } }]}));

  CP.stageMax   = dev.createBuffer({ size:8, usage:GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  CP.stageProbe = dev.createBuffer({ size:Math.max(32, S.Nr * 32),
    usage:GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  CP.mapBusy = false;
  CP.gen = (CP.gen || 0) + 1;
  CP.idx = 0;
  CP.waveMax = Math.sqrt(P.gamma * P.Rgas * P.Tc) * (1 / S.dz + 1 / S.dr);
  CP.machMax = 0;
}

/* The acoustic limit, not the advective one: everything here is bounded by |u| + a. */
function compChooseDt(){
  if (FIXED_DT !== null) return FIXED_DT;
  return Math.min(0.5, Math.min(P.cfl, 0.6) / Math.max(CP.waveMax, 1e-6));
}

function compReset(){
  const dev = WG.dev;
  packParams(0, 0.001, 0, 0);
  dev.queue.writeBuffer(WG.buf.params, 0, WG.paramHost, 0, PARAM_STRIDE);
  const enc = dev.createCommandEncoder();
  const pass = enc.beginComputePass();
  pass.setBindGroup(0, WG.bgP, [0]);
  pass.setPipeline(CP.pipe.initState);
  for (let i = 0; i < 3; i++){
    pass.setBindGroup(1, CP.bg[i][0]);
    pass.dispatchWorkgroups(Math.ceil(S.Nz / 8), Math.ceil(S.Nr / 8));
  }
  pass.end();
  dev.queue.submit([enc.finish()]);
  CP.idx = 0;
  CP.waveMax = Math.sqrt(P.gamma * P.Rgas * P.Tc) * (1 / S.dz + 1 / S.dr);
  CP.machMax = 0;
}

/* Every stage of every step of a frame goes into one command encoder, submitted once, with
   per-stage uniforms addressed by dynamic offset. A dispatch costs ~4 µs; a submit costs
   far more, so the whole frame is planned on the CPU before any of it is queued. */
function compSteps(n){
  const dev = WG.dev, B = CP.buf;
  n = Math.min(n, 1024);
  let tSim = S.t, simmed = 0;
  for (let i = 0; i < n; i++){
    const dt = compChooseDt();
    packParams(2 * i,     dt, 0.0, tSim);           // RK stage 1
    packParams(2 * i + 1, dt, 0.5, tSim + dt);      // RK stage 2
    tSim += dt; simmed += dt;
  }
  dev.queue.writeBuffer(WG.buf.params, 0, WG.paramHost, 0, 2 * n * PARAM_STRIDE);

  const gz = Math.ceil((S.Nz + 1) / 64), gzc = Math.ceil(S.Nz / 64);
  const gc = [Math.ceil(S.Nz / 8), Math.ceil(S.Nr / 8)];
  const enc = dev.createCommandEncoder();
  const pass = enc.beginComputePass();

  for (let i = 0; i < n; i++){
    for (let stage = 0; stage < 2; stage++){
      pass.setBindGroup(0, WG.bgP, [(2 * i + stage) * PARAM_STRIDE]);
      pass.setBindGroup(1, CP.bg[CP.idx][stage]);
      pass.setPipeline(CP.pipe.fluxZ);  pass.dispatchWorkgroups(gz, S.Nr);
      pass.setPipeline(CP.pipe.fluxR);  pass.dispatchWorkgroups(gzc, S.Nr + 1);
      pass.setPipeline(CP.pipe.update); pass.dispatchWorkgroups(gc[0], gc[1]);
    }
    CP.idx = (CP.idx + 2) % 3;
  }

  // wave speed and probe read the state that is now current
  pass.setBindGroup(0, WG.bgP, [(2 * n - 1) * PARAM_STRIDE]);
  pass.setBindGroup(1, CP.bg[CP.idx][0]);
  pass.setPipeline(CP.pipe.waveSpeed);   pass.dispatchWorkgroups(gc[0], gc[1]);
  pass.setPipeline(CP.pipe.probeGather); pass.dispatchWorkgroups(Math.ceil(S.Nr / 64));
  pass.setPipeline(WG.pipe.reduceMax);
  CP.red.forEach((L, i) => {
    pass.setBindGroup(0, CP.bgRP, [i * PARAM_STRIDE]);
    pass.setBindGroup(1, CP.bgRed[i]);
    pass.dispatchWorkgroups(Math.ceil(L.n / 256));
  });
  pass.end();

  const last = CP.red[CP.red.length - 1];
  // Capture the staging buffers and the grid generation now: a rebuild may swap both out
  // before this readback resolves, and unmapping the wrong buffer corrupts the next submit.
  const sMax = CP.stageMax, sProbe = CP.stageProbe, gen = CP.gen, nr = S.Nr;
  if (!CP.mapBusy){
    enc.copyBufferToBuffer(last.out, 0, sMax, 0, 8);
    enc.copyBufferToBuffer(B.probe, 0, sProbe, 0, nr * 32);
  }
  dev.queue.submit([enc.finish()]);

  if (!CP.mapBusy){
    CP.mapBusy = true;
    const tag = S.t + simmed;
    Promise.all([sMax.mapAsync(GPUMapMode.READ), sProbe.mapAsync(GPUMapMode.READ)]).then(() => {
      const m  = new Float32Array(sMax.getMappedRange().slice(0));
      const pr = new Float32Array(sProbe.getMappedRange().slice(0));
      sMax.unmap(); sProbe.unmap();
      if (gen !== CP.gen) return;            // stale sample from a grid that no longer exists
      CP.mapBusy = false;
      if (!Number.isFinite(m[0]) || m[0] <= 0){ flagDivergence(NaN); return; }
      CP.waveMax = m[0];
      CP.machMax = m[1];
      S.vmax = Math.max(CP.machMax * Math.sqrt(P.gamma * P.Rgas * P.tAmb), 1);
      consumeProbeArr(pr, tag);
    }).catch(() => { if (gen === CP.gen) CP.mapBusy = false; });
  }

  S.t += simmed;
  return simmed;
}

function compRender(targetView, outW, outH){
  const dev = WG.dev, cv = WG.canvas;
  S.colourScale = activeColourScale();
  const su = new Float32Array(8);
  su[0] = outW || cv.width; su[1] = outH || cv.height; su[2] = VIEW.field; su[3] = S.colourScale;
  su[4] = VIEW.showGeom ? 1 : 0;
  su[5] = probeIz().zP;
  su[6] = (EXPORTING && WG.fmt === 'bgra8unorm') ? 1 : 0;
  dev.queue.writeBuffer(WG.buf.showU, 0, su);
  packParams(0, S.dt || 0.001, 0, S.t);
  dev.queue.writeBuffer(WG.buf.params, 0, WG.paramHost, 0, PARAM_STRIDE);

  const enc = dev.createCommandEncoder();
  const pass = enc.beginRenderPass({ colorAttachments:[{
    view: targetView || WG.ctx.getCurrentTexture().createView(),
    clearValue:{ r:0.02, g:0.03, b:0.04, a:1 }, loadOp:'clear', storeOp:'store' }] });
  pass.setPipeline(CP.pipe.show);
  pass.setBindGroup(0, WG.bgP, [0]);
  pass.setBindGroup(1, CP.bgS[CP.idx]);
  pass.setBindGroup(2, WG.bgS);
  pass.draw(3);
  pass.end();
  dev.queue.submit([enc.finish()]);
}
</script>

<script>
"use strict";
/* ========================== colour legend ==========================
   The colour maps are duplicated from the shader rather than shared, because one lives in
   WGSL and the other in JavaScript. They must stay in step; the fits below are the same
   polynomials. */
function viridisJS(t){
  t = Math.min(1, Math.max(0, t));
  const c = [[0.2777,0.0054,0.3341],[0.1051,1.4046,1.3846],[-0.3309,0.2148,0.0951],
             [-4.6342,-5.7991,-19.3324],[6.2283,14.1799,56.6906],
             [4.7764,-13.7451,-65.3530],[-5.4355,4.6459,26.3124]];
  const o = [0,0,0];
  for (let i = 0; i < 3; i++){
    let v = c[6][i];
    for (let k = 5; k >= 0; k--) v = c[k][i] + t * v;
    o[i] = Math.min(1, Math.max(0, v));
  }
  return o;
}
function divergingJS(t){
  const a = Math.min(1, Math.abs(t));
  const c = t < 0 ? [0.25,0.55,1.0] : [1.0,0.42,0.25];
  const bg = [0.055,0.07,0.09], k = Math.pow(a, 0.75);
  return [0,1,2].map(i => bg[i] + (c[i] - bg[i]) * k);
}
const rgb = c => `rgb(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)})`;

/* What each field means, and in what units. `scale` is the shader's own colour scale. */
function legendSpec(scale){
  switch (VIEW.field){
    case 0: return { name:'exhaust fraction', unit:'0 air \u2192 1 exhaust', lo:0, hi:1, map:'grey' };
    case 1: return { name:'speed |u|', unit:'m/s', lo:0, hi:scale, map:'viridis' };
    case 2: return { name:'vorticity  \u03c9_\u03b8', unit:'1/ms', lo:-scale, hi:scale, map:'div' };
    case 3: return { name:'pressure \u2212 ambient', unit:'Pa', lo:-scale, hi:scale, map:'div' };
    case 4: return { name:'axial velocity  u_z', unit:'m/s', lo:-scale, hi:scale, map:'div' };
    case 5: return { name:'Mach number', unit:'M = 1 in white', lo:0, hi:scale, map:'viridis' };
    case 7: return { name:'temperature', unit:'K', lo:0, hi:scale, map:'viridis' };
    default: return { name:'schlieren  |\u2207\u03c1|', unit:'relative', lo:0, hi:1, map:'grey' };
  }
}
const legendCv = document.getElementById('legend');
const lctx = legendCv.getContext('2d');
function fmtTick(v){
  const a = Math.abs(v);
  if (a === 0) return '0';
  if (a >= 1000) return (v/1000).toFixed(1) + 'k';
  if (a >= 10) return v.toFixed(0);
  if (a >= 1) return v.toFixed(1);
  if (a >= 0.01) return v.toFixed(2);
  return v.toExponential(1);
}

/* Paints the ramp, its name, units and end/mid ticks into any 2D context, so the on-screen
   legend and the one burned into exported video come from the same code. */
function paintLegend(ctx, x, y, w, h, scale, fontPx){
  const sp = legendSpec(scale);
  const f = fontPx || 10;
  const bh = Math.max(6, Math.round(h * 0.24));
  const by = y + f + 4;
  for (let i = 0; i < w; i++){
    const t = i / (w - 1);
    let c;
    if (sp.map === 'viridis') c = viridisJS(t);
    else if (sp.map === 'div') c = divergingJS(t * 2 - 1);
    else c = [t, t, t];
    ctx.fillStyle = rgb(c);
    ctx.fillRect(x + i, by, 1, bh);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, by + 0.5, w - 1, bh - 1);
  ctx.font = f + 'px ui-monospace, SFMono-Regular, Menlo, monospace';
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';  ctx.fillStyle = '#c8d4e0'; ctx.fillText(sp.name, x, by - 4);
  ctx.textAlign = 'right'; ctx.fillStyle = '#8b97a6'; ctx.fillText(sp.unit, x + w, by - 4);
  ctx.fillStyle = '#c8d4e0';
  ctx.textAlign = 'left';   ctx.fillText(fmtTick(sp.lo), x, by + bh + f + 1);
  ctx.textAlign = 'center'; ctx.fillText(fmtTick((sp.lo + sp.hi) / 2), x + w/2, by + bh + f + 1);
  ctx.textAlign = 'right';  ctx.fillText(fmtTick(sp.hi), x + w, by + bh + f + 1);
  ctx.textAlign = 'left';
}

function drawLegend(scale){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = 220, h = 38;
  if (legendCv.width !== Math.round(w*dpr)){
    legendCv.width = Math.round(w*dpr); legendCv.height = Math.round(h*dpr);
  }
  lctx.setTransform(dpr,0,0,dpr,0,0);
  lctx.clearRect(0,0,w,h);
  paintLegend(lctx, 4, 1, w - 8, h - 2, scale, 10);
}

/* ========================== time-series plot ========================== */
const plot = document.getElementById('plot'), pctx = plot.getContext('2d');
function drawPlot(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = plot.clientWidth, h = plot.clientHeight;
  if (plot.width !== Math.round(w*dpr)){ plot.width = Math.round(w*dpr); plot.height = Math.round(h*dpr); }
  pctx.setTransform(dpr,0,0,dpr,0,0);
  pctx.clearRect(0,0,w,h);
  DOM.plotTitle.textContent =
    `axial velocity at the measurement plane, ${P.probe > 0 ? fmt(P.probe,0) + ' mm past the ' : 'at the '}` +
    `nozzle exit   —   on-axis (cyan) and plane maximum (orange)`;

  const ser = S.series;
  if (ser.length < 2) return;
  const t1 = Math.max(ser[ser.length-1][0], 1);
  let vmaxP = 0.5;
  for (const s of ser) vmaxP = Math.max(vmaxP, Math.abs(s[1]), Math.abs(s[2]));
  const X = t => 34 + (w - 44) * (t / t1);
  const Y = v => h - 16 - (h - 26) * (v / (vmaxP*1.08));

  pctx.strokeStyle = '#2b3440'; pctx.lineWidth = 1;
  pctx.beginPath(); pctx.moveTo(X(0), Y(0)); pctx.lineTo(X(t1), Y(0)); pctx.stroke();
  pctx.fillStyle = '#8b97a6'; pctx.font = '10px ui-monospace, monospace';
  pctx.fillText(fmt(vmaxP,1)+' m/s', 2, 12);
  pctx.fillText('0', 22, Y(0)-2);
  pctx.fillText(fmt(t1,0)+' ms', w-44, h-3);

  for (const [idx, colr] of [[1,'#5ec6ff'], [2,'#ffb454']]){
    pctx.strokeStyle = colr; pctx.lineWidth = 1.4; pctx.beginPath();
